<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workforce</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Covalent Gap Tracker, R1. Tokens follow claude/covalent-prototype-tokens.md: Roboto, Royal Blue app bar, light only. */
:root {
  --primary: #05448E; --primary-wash: #E2ECF9; --primary-hover: #04386F;
  --text: #1C1C1C; --text-2: #4A4F57; --text-3: #6B6F76;
  --page: #F0F0F0; --paper: #FFFFFF; --divider: #E0E0E0; --divider-2: #EEEEEE;
  --ok: #167F36; --ok-bg: #DCFCE5; --warn: #8A4B00; --warn-bg: #FFF2C6; --err: #B00020; --err-bg: #FFF1F2;
  --emp: #0F5FBD; --emp-bg: #E2EFFD; --job: #146C2E; --job-bg: #E2F4E6; --obj: #8A4300; --obj-bg: #FCEEDD; --grp: #5B45B0; --grp-bg: #EEEAFB;
  --metric: #05448E; --metric-bg: #F3F7FC; --attr: #0B5E58;
  --proto: #1E2633; --proto-hi: #F08A24;
  --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono: 'Roboto Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45 }
button, input, select, textarea { font: inherit; color: inherit }
.app { min-height: 100%; display: flex; flex-direction: column }
.ico { flex: none; display: inline-block; vertical-align: -3px }
.rot { transform: rotate(-90deg) }
.min-w-0 { min-width: 0 }
.hint { color: var(--text-3); font-size: 12.5px }
.nowrap { white-space: nowrap }
.ml { margin-left: 6px }
.mt { margin-top: 8px }
code { font-family: var(--mono); font-size: 12px; background: var(--page); padding: 0 4px; border-radius: 3px }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, tr:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px }

/* prototype chrome */
.protobar { background: var(--proto); color: #E7ECF3; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.pb-left, .pb-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.proto-label { font-weight: 700; font-size: 12px; letter-spacing: .05em; color: var(--proto-hi) }
.proto-sub { font-size: 12px; color: #B8C2D1 }
.proto-btn { background: transparent; border: 1px solid #4A5568; color: #E7ECF3; border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer }
.proto-on, .proto-btn:hover { border-color: var(--proto-hi); color: var(--proto-hi) }
.script { background: #2A3343; color: #E7ECF3; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.script ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 980px; font-size: 13px }
.slink { background: none; border: 0; color: var(--proto-hi); text-decoration: underline; cursor: pointer; margin-left: 8px; font-size: 13px; padding: 0 }

.appbar { background: var(--primary); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ab-left, .ab-right { display: flex; align-items: center; gap: 4px; flex-wrap: wrap }
.ab-right { gap: 12px }
.env-pill { background: #1F87ED; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 12px; letter-spacing: .05em; margin-right: 8px }
.appbar-menu { display: inline-flex; align-items: center; gap: 2px; padding: 4px 8px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; border-radius: 4px }
.appbar-on { background: rgba(255, 255, 255, .16) }
.appbar-icon { display: inline-flex }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #1976D2; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; border: 1px solid rgba(255, 255, 255, .5) }
.subnav { background: var(--paper); border-bottom: 1px solid var(--divider); display: flex; gap: 4px; overflow-x: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.subnav-btn { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font-weight: 500; text-transform: uppercase; font-size: 13px; letter-spacing: .03em; color: var(--text-2); cursor: pointer; white-space: nowrap }
.subnav-on { color: var(--primary); border-bottom-color: var(--primary) }
.subnav-off { color: #9E9E9E; cursor: default }
.main { padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0 }
.page { display: flex; flex-direction: column; gap: 14px; max-width: 1560px; margin: 0 auto; min-width: 0 }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap }
.page-title { font-size: 22px; font-weight: 500; margin: 0 }
.page-sub { margin: 2px 0 0; color: var(--text-2); max-width: 70ch }
.card { background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; padding: 14px; min-width: 0 }
.card-title { font-size: 15px; font-weight: 500; margin: 0 }

/* controls */
.btn-primary, .btn-outlined, .btn-text { display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; font-weight: 500; letter-spacing: .03em; font-size: 13px; border-radius: 4px; padding: 7px 14px; cursor: pointer; white-space: nowrap }
.btn-primary { background: var(--primary); color: #fff; border: 1px solid var(--primary); box-shadow: 0 1px 2px rgba(0, 0, 0, .2) }
.btn-primary:hover { background: var(--primary-hover) }
.btn-primary:disabled { background: var(--divider); color: #9E9E9E; border-color: var(--divider); box-shadow: none; cursor: not-allowed }
.btn-outlined { background: var(--paper); color: var(--primary); border: 1px solid var(--primary) }
.btn-outlined:disabled { color: #9E9E9E; border-color: var(--divider); cursor: not-allowed }
.btn-text { background: none; border: 1px solid transparent; color: var(--primary); padding-inline: 6px }
.btn-sm { padding: 4px 10px; font-size: 12px }
.icon-btn { background: none; border: 0; color: var(--text-2); cursor: pointer; padding: 4px; border-radius: 4px; display: inline-flex }
.icon-btn:hover { background: var(--page) }
.sel, .inp { border: 1px solid #C4C4C4; border-radius: 4px; padding: 6px 8px; background: var(--paper); font-size: 13px; max-width: 100%; min-width: 0 }
.inp { width: 100% }
.inp-num { width: 80px }
textarea.inp { resize: vertical }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-3) }
.fld > span:first-child { font-weight: 500 }
.fld-inline { flex-direction: row; align-items: center; gap: 8px }
.search { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #C4C4C4; border-radius: 4px; padding: 0 8px; background: var(--paper); color: var(--text-3); min-width: 0 }
.search input { border: 0; outline: 0; padding: 7px 0; background: transparent; min-width: 0; width: 220px; max-width: 100% }
.search-sm { width: 100% }
.search-sm input { width: 100%; padding: 5px 0; font-size: 13px }
.seg-group { display: inline-flex; flex-wrap: wrap; gap: 4px }
.seg { border: 1px solid var(--divider); background: var(--paper); border-radius: 16px; padding: 4px 12px; font-size: 13px; cursor: pointer }
.seg-on { background: var(--primary); color: #fff; border-color: var(--primary) }
.status { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap }
.st-pub { color: var(--ok); background: var(--ok-bg) }
.st-draft { color: var(--warn); background: var(--warn-bg) }
.st-old { color: var(--text-2); background: var(--page) }
.notice { background: #F3F7FC; color: #39475B; border: 1px solid #DCE6F3; border-radius: 4px; padding: 10px 12px; font-size: 13px }

/* library */
.lib-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.lib-card { padding: 0 }
.table-wrap { overflow-x: auto; max-width: 100% }
.lib { border-collapse: collapse; width: 100%; font-size: 13px }
.lib th { background: var(--page); text-align: left; font-weight: 500; padding: 9px 12px; border-bottom: 1px solid var(--divider); white-space: nowrap }
.lib td { padding: 10px 12px; border-bottom: 1px solid var(--divider); vertical-align: top }
.lib-row { cursor: pointer }
.lib-row:hover td { background: #FAFBFD }
.lib-name-cell { min-width: 220px; max-width: 300px }
.lib-name { display: block; font-weight: 500; color: var(--primary) }
.lib-desc { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px }
.lib-formula { min-width: 260px; max-width: 420px }
.mini-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid #C9D6EA; color: var(--metric); background: var(--metric-bg); margin: 0 4px 4px 0; white-space: nowrap }
.mini-plan { border-color: var(--divider); color: var(--text-2); background: var(--page) }
.empty { text-align: center; color: var(--text-3); padding: 24px }
/* checks */
.checks { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px }
.checks-ok { border-left: 4px solid var(--ok) }
.checks-bad { border-left: 4px solid var(--err) }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px }
.chk-ok { color: var(--ok); font-weight: 500 }
.chk-err { color: var(--err) }
.chk-warn { color: var(--warn) }
.chk .ico { margin-top: 1px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: #1E2633; color: #fff; padding: 10px 16px; border-radius: 4px; display: inline-flex; gap: 8px; align-items: center; z-index: 60; font-size: 13.5px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25) }
.toast .ico { color: #6FD08C }


.table-wrap { position: relative }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.link-btn { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font: inherit }
.link-btn:hover { text-decoration: underline }
.st-sched { color: var(--primary); background: var(--primary-wash) }
.dim-tag { display: inline-block; font-size: 12px; font-weight: 500; color: var(--text-2); border: 1px solid var(--divider); border-radius: 10px; padding: 0 8px }
.scope-cell { min-width: 220px; max-width: 300px }
.actions-cell { text-align: right }
.lib td .lib-desc { white-space: normal }

/* builder frame */
.b-head { display: flex; flex-direction: column; gap: 8px }
.b-head > .btn-text { align-self: flex-start; padding-left: 0 }
.b-title-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.b-foot { position: sticky; bottom: 0; z-index: 5; background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 -2px 8px rgba(0, 0, 0, .06); margin-bottom: env(safe-area-inset-bottom, 0px) }
.b-foot-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end }

/* the target matrix: the one memorable element */
.mx-block { background: var(--paper); border: 1px solid var(--divider); border-radius: 6px; overflow: hidden; min-width: 0 }
.mx-card { padding: 0 }
.mx-card .mx-block { border: 0 }
.mx-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--divider) }
.mx-title-main { font-weight: 500; font-size: 15px }
.mx-title-sub { font-size: 12.5px; color: var(--text-3) }

.tx-short { color: var(--err) }
.tx-ok { color: var(--ok) }
.tx-late { color: var(--err) }
.tx-risk { color: var(--warn) }
.row-dim td { color: var(--text-3) }
.lib-name-off { color: var(--text-2) }
.lib-desc .ico { color: var(--metric); margin-right: 2px }

/* plan page */
.pp-title-row { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: flex-end }
.pp-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; margin-top: 6px; font-size: 13px; color: var(--text-2) }
.pp-controls { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--divider); margin-top: 6px; overflow-x: auto }
.tab { background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 12px 8px; font-weight: 500; font-size: 14px; color: var(--text-2); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap }
.tab-on { color: var(--primary); border-bottom-color: var(--primary) }
.tab-badge { background: var(--err); color: #fff; border-radius: 10px; font-size: 11.5px; font-weight: 600; padding: 0 7px; line-height: 18px }
.tab-badge-risk { background: var(--warn-bg); color: var(--warn) }

/* matrix: palette from the Q4 coverage gap workbook */
:root { --x-navy: #05448E; --x-shift: #0D53A5; --x-ok: #17A241; --x-ok-bg: #F0FDF3; --x-ok2: #167F36; --x-ok2-bg: #D3F8DE; --x-bad: #C2101B; --x-bad-bg: #FFF1F2; --x-band: #F5F5F5; --x-ink: #212121; --x-label: #525151 }
.matrix-wrap { display: flex; flex-direction: column; gap: 12px }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px }
.kpi { background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; border-top: 4px solid var(--divider) }
.kpi-l { font-size: 12.5px; font-weight: 700; color: var(--x-label) }
.kpi-v { font-size: 26px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums }
.kpi-of { font-size: 15px; font-weight: 500; opacity: .8 }
.kpi-s { font-size: 12px; color: var(--text-3) }
.kpi-bad { background: var(--x-bad-bg); border-color: #F6C9CD; border-top-color: var(--x-bad) }
.kpi-bad .kpi-v { color: var(--x-bad) }
.kpi-ok { background: var(--x-ok-bg); border-color: #BFE9CC; border-top-color: var(--x-ok) }
.kpi-ok .kpi-v { color: var(--x-ok2) }
.kpi-plain { border-top-color: var(--x-navy) }
.kpi-date { font-size: 20px; color: var(--x-navy) }
.gx { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--x-ink) }
.gx thead th { background: var(--x-shift); color: #fff; font-weight: 700; font-size: 12px; padding: 7px 6px; text-align: center; white-space: nowrap; border-bottom: 1px solid rgba(255, 255, 255, .15) }
.gx thead tr:first-child th { padding-top: 10px; font-size: 13px }
.gx thead th.gx-job { background: var(--x-navy); text-align: left; vertical-align: bottom; min-width: 200px }
.gx thead th.gx-tot { background: var(--x-navy) }
.gx-grp { border-left: 2px solid rgba(255, 255, 255, .35) }
.gx-grp-sub { display: block; font-size: 11px; font-weight: 400; color: #D4E2F4 }
.gx-sub { font-weight: 600 !important }
.gx thead .grp-start { border-left: 2px solid rgba(255, 255, 255, .35) }
.gx-sticky { position: sticky; left: 0; z-index: 2 }
.gx thead .gx-sticky { z-index: 3 }
.gx tbody th { text-align: left; font-weight: 500; padding: 8px 10px; background: var(--paper); border-bottom: 1px solid var(--divider-2); border-right: 1px solid var(--divider); white-space: nowrap }
.gx tbody tr.row-band th, .gx tbody tr.row-band td { background: var(--x-band) }
.q { text-align: center; padding: 6px 5px; border-bottom: 1px solid var(--divider-2); min-width: 54px; vertical-align: middle; background: var(--paper) }
.grp-start { border-left: 2px solid var(--divider) }
.q-t { color: var(--text-2) }
.q-btn { background: none; border: 0; padding: 1px 6px; border-radius: 3px; cursor: pointer; font: inherit; font-weight: 500; color: inherit }
.q-btn:hover { background: var(--primary-wash) }
.q-sub { display: block; font-size: 10.5px; color: var(--text-3); line-height: 1.2; white-space: nowrap; font-weight: 400 }
.q-sub .ico { vertical-align: -2px; margin-right: 1px }
.q-on { box-shadow: inset 0 0 0 2px var(--x-shift) }
.q-g, .q-att { font-weight: 600 }
.gx td.m-ok { background: var(--x-ok-bg); color: var(--x-ok) }
.gx tr.row-band td.m-ok { background: var(--x-ok2-bg); color: var(--x-ok2) }
.gx td.m-bad, .gx tr.row-band td.m-bad { background: var(--x-bad-bg); color: var(--x-bad) }
.q-after { color: var(--primary) !important; font-weight: 500 }
.met { display: inline-flex; width: 24px; height: 24px; border-radius: 4px; align-items: center; justify-content: center; color: #fff }
.met-ok { background: var(--x-ok) }
.row-band .met-ok { background: var(--x-ok2) }
.met-bad { background: var(--x-bad) }
.q-met { min-width: 40px }
.gx tfoot th, .gx tfoot td { border-top: 2px solid var(--x-navy) }
.gx tfoot th { background: var(--x-navy); color: #fff; font-weight: 700; padding: 9px 10px; text-align: left; white-space: nowrap; font-size: 14px }
.gx tfoot td.q-sum { background: var(--x-navy); color: #fff; font-weight: 700; font-size: 14px }
.gx tfoot td.q-sum .q-sub { color: #D4E2F4 }
.gx tfoot td.m-ok, .gx tfoot td.m-bad { font-size: 14px; font-weight: 700 }
.gx tfoot td.q-met { background: var(--paper) }
.gx tfoot .grp-start { border-left: 2px solid rgba(255, 255, 255, .35) }
.gx-foot-sub { display: block; font-size: 10.5px; font-weight: 400; color: #D4E2F4 }
.detail { border-top: 1px solid var(--divider); padding: 12px 14px; background: #FAFBFD }
.detail-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13.5px }
.detail-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
.dd-h { font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 4px }
.dd-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px }
.dd-list li { display: flex; flex-direction: column }
.pname { font-weight: 500 }

/* tracker */
.tracker { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start }
.tracker-main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.tr-summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.tr-stats { display: flex; gap: 22px; flex-wrap: wrap }
.tr-stats > div { display: flex; align-items: baseline; gap: 6px }
.tr-num { font-size: 24px; font-weight: 500; color: var(--primary); font-variant-numeric: tabular-nums }
.tr-cap { font-size: 13px; color: var(--text-2) }
.gap { padding: 0; border-left: 4px solid var(--err) }
.gap-risk { border-left-color: #E3A008 }
.gap-head { padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--divider-2) }
.gap-title-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.gap-badge { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px }
.gb-short { background: var(--err); color: #fff }
.gb-risk { background: var(--warn-bg); color: var(--warn) }
.gap-title { margin: 0; font-size: 16px; font-weight: 500; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; min-width: 0 }
.gap-where { font-size: 13px; font-weight: 400; color: var(--text-2) }
.gstatus { margin-left: auto; font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 10px; white-space: nowrap }
.gs-open { color: var(--err); background: var(--err-bg) }
.gs-partial { color: var(--warn); background: var(--warn-bg) }
.gs-planned { color: var(--ok); background: var(--ok-bg) }
.gs-risk { color: var(--warn); background: var(--warn-bg) }
.gap-facts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--text-2) }
.gap-cause { margin: 0; font-size: 13px; color: var(--warn); display: flex; gap: 6px; align-items: flex-start }
.gap-cause .ico { margin-top: 2px }
.tally { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.tally-bar { display: inline-flex; gap: 3px }
.tb { width: 22px; height: 10px; border-radius: 2px }
.tb-empty { background: var(--err-bg); box-shadow: inset 0 0 0 1px #F3B6BE }
.tb-plan { background: var(--ok) }
.tb-motion { background: #6FB98A }
.tally-text { font-size: 12.5px; color: var(--text-2) }
.levers { display: flex; flex-direction: column }
.lever { display: grid; grid-template-columns: 190px minmax(0, 1fr); border-bottom: 1px solid var(--divider-2) }
.lever:last-child { border-bottom: 0 }

/* R3: markers, legend, tooltips, cell panel */

.lg-how { margin-left: auto }

.cpanel { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; z-index: 40; background: var(--paper); border-left: 1px solid var(--divider); box-shadow: -8px 0 28px rgba(15, 30, 55, .16); display: flex; flex-direction: column; animation: cp-in .16s ease-out }

.cp-riskline { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px 18px; font-size: 13px; color: #8A4B00; background: #FFF8E1; border-bottom: 1px solid var(--divider) }
.cp-body { overflow-y: auto; padding: 4px 18px 24px; flex: 1 1 auto; padding-bottom: max(24px, env(safe-area-inset-bottom, 0px)) }

.uc-t { font-size: 13px; font-weight: 500 }
.uc-s { font-size: 11.5px; color: var(--text-3) }
.uc-when { grid-area: when; font-size: 12px; font-weight: 600; color: var(--text-2); white-space: nowrap }
.st-chip { grid-area: chip; justify-self: start; font-size: 10.5px; font-weight: 600; border-radius: 8px; padding: 0 7px; line-height: 16px }
.st-confirmed { background: #E8F6EC; color: var(--x-ok2) }
.st-planned { background: #fff; color: #2A78D6; box-shadow: inset 0 0 0 1px #9CC2EE }
.st-committed { background: #E3EDFA; color: var(--x-shift) }
.uc-planned .uc-t { color: var(--text-2) }
.pt { width: 440px }
.pt-body { display: flex; flex-direction: column; gap: 16px; background: var(--paper) }
.pt-h { margin: 0 0 6px; font-size: 13.5px; font-weight: 600 }
.pt-seg.seg-S1, .ikey-sw.seg-S1 { fill: #05448E; background: #05448E }
.pt-seg.seg-S2, .ikey-sw.seg-S2 { fill: #2A78D6; background: #2A78D6 }
.pt-seg.seg-S3, .ikey-sw.seg-S3 { fill: #7FB0E8; background: #7FB0E8 }
.pt-seg.seg-leave, .ikey-sw.seg-leave { fill: #D5D8DD; background: #D5D8DD }
.pt-seg.seg-gone, .ikey-sw.seg-gone { fill: #E9DDF6; background: #E9DDF6 }
.pt-seg.seg-none { fill: #F1F3F6 }
.pt-job { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px; align-items: center; font-size: 12px }
.pt-jn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pt-ok { fill: var(--x-ok) }
.pt-no { fill: #EEF0F3 }
@media (max-width: 1100px) { .wf-grid { grid-template-columns: minmax(0, 1fr) } .uc-card { position: static; max-height: none } }
@media (max-width: 820px) { .board { grid-template-columns: minmax(0, 1fr) !important } .pt { width: 100% } }

/* R10: time off and coverage calendar */
.wf-right { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap }
.wf-tabs { margin-top: 0 }
.bc-add { align-self: flex-start; padding-left: 0 }
.uc-acts { display: flex; gap: 4px; padding: 0 0 8px 32px }
.pt-hrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px }
.pt-hrow .pt-h { margin: 0 }
.pt-seg.seg-req, .ikey-sw.seg-req { fill: #fff; stroke: #2A78D6; stroke-dasharray: 3 2; stroke-width: 1.5; background: #fff; box-shadow: inset 0 0 0 1.5px #2A78D6 }
.rot-r { transform: rotate(-90deg) }
.to-modal { width: min(720px, 100%); max-height: calc(100vh - 32px); overflow-y: auto }
.to-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) 1fr 1fr; gap: 10px 14px }
.to-person .sel { width: 100% }
.to-set { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px }
.to-set legend { font-size: 12px; font-weight: 600; color: var(--text-2); padding: 0; margin-bottom: 6px }
.to-reasons { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px }
.to-r { display: flex; gap: 6px; align-items: center; border: 1px solid var(--divider); border-radius: 4px; padding: 7px 9px; font-size: 13px; cursor: pointer }
.to-r input { accent-color: var(--x-navy) }
.to-r-on { border-color: var(--x-navy); background: #F3F7FC; font-weight: 500 }
.to-imp { border: 1px solid var(--divider); border-radius: 6px; padding: 10px 12px; background: #FAFBFD; display: flex; flex-direction: column; gap: 6px }
.to-h { margin: 0; font-size: 14px; font-weight: 600 }
.to-sub { margin: 0; font-size: 12px; color: var(--text-3) }
.to-t { border-collapse: collapse; width: 100%; font-size: 12.5px }
.to-t th { text-align: left; font-weight: 600; color: var(--text-3); font-size: 11.5px; padding: 4px 6px; border-bottom: 1px solid var(--divider) }
.to-t td { padding: 5px 6px; border-bottom: 1px solid var(--divider-2) }
.to-t .num { text-align: right }
.to-bad td { background: var(--x-bad-bg) }
.to-bad td b { color: var(--x-bad) }
.to-clash { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: #8A4B00 }
.to-clash li { display: flex; gap: 6px; align-items: flex-start }
.to-clash .ico { margin-top: 2px; flex: none }
.to-okline { margin: 0; display: flex; gap: 6px; align-items: center; font-size: 13px }
.cc { display: flex; flex-direction: column; gap: 10px; padding: 14px }
.cc-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start }
.cc-head .hint { margin: 2px 0 0; max-width: 80ch }
.cc-tools { display: flex; flex-direction: column; gap: 6px; align-items: flex-end }
.cc-nav { display: flex; align-items: center; gap: 6px }
.cc-range { font-size: 12.5px; font-weight: 600; min-width: 112px; text-align: center }
.cct { border-collapse: separate; border-spacing: 2px; font-size: 12px; font-variant-numeric: tabular-nums }
.cct th { font-weight: 500; color: var(--text-3); font-size: 10.5px }
.cct-job { text-align: left; white-space: nowrap; color: var(--x-ink) !important; font-size: 12.5px !important; padding-right: 8px; position: sticky; left: 0; background: var(--paper); z-index: 1 }
.cct-t { color: var(--text-2); padding: 0 6px }
.cct-d { width: 30px; min-width: 30px; text-align: center; line-height: 1.15 }
.cct-d span, .cct-d b { display: block }
.cct-d b { font-size: 12px; color: var(--x-ink); font-weight: 600 }
.cct-m { font-size: 10px; color: var(--x-navy); font-weight: 600 }
.cct-we b { color: var(--text-3) }
.cct-tgt b { color: #fff; background: var(--x-navy); border-radius: 3px }
.cct-c { height: 28px; text-align: center; border-radius: 3px; font-weight: 700; outline-offset: 1px; position: relative }
.cct-c span i { display: block; font-style: normal; font-size: 9.5px; font-weight: 600; line-height: 1; opacity: .85 }
.cc-ok, .ikey-sw.cc-ok { background: #DCF5E3; color: var(--x-ok2) }
.cc-warn, .ikey-sw.cc-warn { background: #FFF2C6; color: #8A4B00 }
.cc-1, .ikey-sw.cc-1 { background: #F7B5BB; color: #7A0A12 }
.cc-2, .ikey-sw.cc-2 { background: var(--x-bad); color: #fff }
.cc-off, .ikey-sw.cc-off { background: repeating-linear-gradient(135deg, #F3F4F6 0 3px, #fff 3px 6px) }
.cc-na { background: #F3F4F6 }
.cc-req { box-shadow: inset 0 0 0 1.5px #2A78D6 }
@media (max-width: 820px) { .to-grid, .to-reasons { grid-template-columns: minmax(0, 1fr) 1fr } .to-person { grid-column: 1 / -1 } .cc-tools { align-items: flex-start } }
/* R10 modal shell */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(15, 30, 55, .42) }
.modal { background: #fff; border-radius: 8px; box-shadow: 0 12px 40px rgba(10, 30, 60, .28); padding: 20px 24px }
.modal-title { margin: 0 0 14px; font-size: 20px; font-weight: 500; color: #1d2733 }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid #e3e7ec; position: sticky; bottom: -20px; background: #fff }
@media (max-width: 600px) { .modal { padding: 16px } .modal-wrap { align-items: flex-end; padding: 8px } }
/* ===== R11 layered matrix ===== */
:root { --l-bad: #B3261E; --l-bad-1: #FBEDEC; --l-bad-2: #F5D9D7; --l-warn: #9A5B00; --l-warn-bg: #FFF4DF; --l-ok: #2E7D4F; --l-ok-bg: #EAF5EE; --l-open: #CFD5DC; --l-late: #D99A2B }
/* KPI strip: one quiet row, each card a layer switch */
.kstrip-wrap { margin-bottom: 10px }
.kstrip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--paper); border: 1px solid var(--divider); border-radius: 6px; overflow: hidden }
.kc { text-align: left; background: var(--paper); border: 0; border-left: 1px solid var(--divider-2); padding: 8px 14px 9px; font: inherit; color: var(--x-ink); cursor: pointer; display: flex; flex-direction: column; gap: 1px; position: relative; min-width: 0 }
.kc:first-child { border-left: 0 }
.kc:hover { background: #F7F9FC }
.kc:focus-visible { outline: 2px solid var(--x-shift); outline-offset: -2px }
.kc::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: transparent }
.kc-on { background: #F5F8FC }
.kc-on::after { background: var(--x-navy) }
.kc-top { display: flex; align-items: center; gap: 6px }
.kc-sw { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid #9AA6B4; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none }
.kc-on .kc-sw { background: var(--x-navy); border-color: var(--x-navy) }
.kc-l { font-size: 12px; font-weight: 500; color: var(--x-label) }
.kc-v { font-size: 18px; font-weight: 600; line-height: 1.25; font-variant-numeric: tabular-nums; color: var(--x-ink) }
.kc-u { font-size: 13px; font-weight: 400; color: var(--text-3) }
.kc-s { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.kc-bad .kc-v { color: var(--l-bad) }
.kc-warn .kc-v { color: var(--l-warn) }
.kc-good .kc-v { color: var(--l-ok) }
.kc-bad .kc-sw:not(:empty), .kc-warn .kc-sw:not(:empty), .kc-good .kc-sw:not(:empty) { background: var(--x-navy) }
.kstrip-scope { margin: 6px 2px 0; font-size: 12px; color: var(--x-label) }
/* Control bar */
.mx-bar { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin: 4px 0 6px }
.mx-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 5px }
.mx-ctl-l { font-size: 12px; color: var(--text-3); margin-right: 2px }
.chip { border: 1px solid var(--divider); background: var(--paper); border-radius: 14px; padding: 3px 10px; font: inherit; font-size: 12.5px; color: var(--x-ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px }
.chip:hover { border-color: #9AA6B4 }
.chip-on { background: #E8EFF8; border-color: #9DB6D6; color: var(--x-navy); font-weight: 500 }
.chip:disabled { cursor: not-allowed; opacity: .85 }
.lg-sw { display: inline-block; width: 14px; height: 12px; border-radius: 2px; border: 1px solid var(--divider) }
.lg-sw.g1 { background: var(--l-bad-1); border-color: #EBC5C2 }
.lg-sw.g2 { background: var(--l-bad-2); border-color: #E0B1AD }
.lg-sw.g0 { background: var(--paper) }
.lg-quiet { color: var(--text-3) }
/* Layer 1: gap fill (muted) */
.gx td.g1, .gx tr.row-band td.g1 { background: var(--l-bad-1); color: var(--l-bad) }
.gx td.g2, .gx tr.row-band td.g2 { background: var(--l-bad-2); color: var(--l-bad) }
.gx td.g0 { color: var(--x-ink) }
/* Summary row: quieter than the old navy band */
.gx tfoot th { background: #E9EEF5; color: var(--x-navy); border-top: 2px solid #B9C7DA }
.gx tfoot td.q-sum { background: #F1F4F9; color: var(--x-ink); border-top: 2px solid #B9C7DA }
.gx tfoot td.q-sum.g1 { background: #F7E3E1; color: var(--l-bad) }
.gx tfoot td.q-sum.g2 { background: #F1D0CC; color: var(--l-bad) }
/* Simple cell */
.gx-simple .q { min-width: 92px; padding: 0; height: 46px; position: relative }
.sc-in { display: flex; align-items: center; justify-content: center; height: 100% }
.sc-btn { display: inline-flex; align-items: baseline; gap: 1px; padding: 6px 12px }
.sc-v { font-size: 15px; font-weight: 600 }
.sc-of { font-size: 12px; opacity: .7 }
.gx-simple tbody td { border-left: 1px solid var(--divider-2) }
/* Layer 2: plan bar along the bottom edge */
.q { position: relative }
.pbar { position: absolute; left: 6px; right: 6px; bottom: 4px; height: 4px; display: flex; gap: 2px }
.pbar .pb { flex: 1; border-radius: 1px; display: block }
.pbar-lg { position: static; display: inline-flex; width: 48px; height: 5px }
.pb-motion { background: #1E6B3F }
.pb-plan { background: #5FAE7D }
.pb-late { background: var(--l-late) }
.pb-open { background: var(--l-open) }
.q-g .pbar { left: 8px; right: 8px }
/* Layers 3 and 4: risk marker in the top-right corner */
.rk { display: inline-flex; align-items: center; gap: 2px; font-size: 10.5px; font-weight: 600; line-height: 1; padding: 2px 4px; border-radius: 8px; border: 1px solid; font-variant-numeric: tabular-nums; vertical-align: middle }
.rk-corner { position: absolute; top: 3px; right: 3px }
.rk-seen { color: var(--l-warn); border-color: #E5BE7A; background: var(--paper) }
.rk-open { color: #fff; border-color: #B97A12; background: #B97A12 }
.rk-ok { color: var(--l-ok); border-color: #A9D3B8; background: var(--l-ok-bg) }
.q-el { position: relative }
/* Cell panel risk box */
.cp-riskbox { margin: 10px 16px 0; padding: 10px 12px; border: 1px solid #F0D9AE; background: #FFFAF0; border-radius: 4px }
.cp-riskbox .cp-acts li { padding-left: 2px }
.cp-risknote { margin: 6px 0 0; font-size: 12.5px; color: var(--x-label) }
@media (max-width: 760px) {
  .kstrip { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .kc:nth-child(3) { border-left: 0 }
  .kc:nth-child(n+3) { border-top: 1px solid var(--divider-2) }
  .mx-bar { gap: 8px }
}
.sc-short { display: block; width: 100%; font-size: 10.5px; font-weight: 500; margin-top: 1px }
.gx-simple .q-sum .sc-btn, .gx-simple td.sc:not(:has(button)) .sc-btn { flex-wrap: wrap; justify-content: center; padding: 4px 8px; line-height: 1.15 }
.gx tfoot td.q-sum.g1, .gx tfoot td.q-sum.g2 { background: #F1F4F9 }
.q-el .rk-corner { position: static; margin-left: 4px }
.gx-full td.q { vertical-align: middle }
.gx-full .mk-row { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; justify-content: center; gap: 3px }
.gx-full tbody td.q, .gx-standard tbody td.q { height: 44px }
.q-el { white-space: nowrap }
.cp-stats .m-bad { background: var(--l-bad-1) !important; color: var(--l-bad) !important } .cp-stats .m-ok { background: var(--paper) !important; color: var(--x-ink) !important } .cp-stats { grid-template-columns: repeat(4, minmax(0, 1fr)) }
/* R12 Insights page context line */
.in-ctx { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 13px; color: var(--x-label); margin: 6px 0 14px }
.in-ctx .btn-text { margin-left: auto }
@media (max-width: 760px) { .in-ctx .btn-text { margin-left: 0 } }

</style>
