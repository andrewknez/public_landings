<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Covalent Plan Builder, R1. Tokens follow claude/covalent-prototype-tokens.md: Roboto, Royal Blue app bar, light only. */
:root {
  --primary: #05448E; --primary-wash: #E2ECF9; --primary-hover: #04386F;
  --text: #1C1C1C; --text-2: #4A4F57; --text-3: #6B6F76;
  --page: #F0F0F0; --paper: #FFFFFF; --divider: #E0E0E0; --divider-2: #EEEEEE;
  --ok: #167F36; --ok-bg: #DCFCE5; --warn: #8A4B00; --warn-bg: #FFF2C6; --err: #B00020; --err-bg: #FFF1F2;
  --emp: #0F5FBD; --emp-bg: #E2EFFD; --job: #146C2E; --job-bg: #E2F4E6; --obj: #8A4300; --obj-bg: #FCEEDD; --grp: #5B45B0; --grp-bg: #EEEAFB;
  --metric: #05448E; --metric-bg: #F3F7FC; --attr: #0B5E58;
  --proto: #1E2633; --proto-hi: #F08A24;
  --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono: 'Roboto Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45 }
button, input, select, textarea { font: inherit; color: inherit }
.app { min-height: 100%; display: flex; flex-direction: column }
.ico { flex: none; display: inline-block; vertical-align: -3px }
.rot { transform: rotate(-90deg) }
.min-w-0 { min-width: 0 }
.hint { color: var(--text-3); font-size: 12.5px }
.nowrap { white-space: nowrap }
.ml { margin-left: 6px }
.mt { margin-top: 8px }
code { font-family: var(--mono); font-size: 12px; background: var(--page); padding: 0 4px; border-radius: 3px }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, tr:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px }

/* prototype chrome */
.protobar { background: var(--proto); color: #E7ECF3; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.pb-left, .pb-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.proto-label { font-weight: 700; font-size: 12px; letter-spacing: .05em; color: var(--proto-hi) }
.proto-sub { font-size: 12px; color: #B8C2D1 }
.proto-btn { background: transparent; border: 1px solid #4A5568; color: #E7ECF3; border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer }
.proto-on, .proto-btn:hover { border-color: var(--proto-hi); color: var(--proto-hi) }
.script { background: #2A3343; color: #E7ECF3; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.script ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 980px; font-size: 13px }
.slink { background: none; border: 0; color: var(--proto-hi); text-decoration: underline; cursor: pointer; margin-left: 8px; font-size: 13px; padding: 0 }

.appbar { background: var(--primary); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ab-left, .ab-right { display: flex; align-items: center; gap: 4px; flex-wrap: wrap }
.ab-right { gap: 12px }
.env-pill { background: #1F87ED; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 12px; letter-spacing: .05em; margin-right: 8px }
.appbar-menu { display: inline-flex; align-items: center; gap: 2px; padding: 4px 8px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; border-radius: 4px }
.appbar-on { background: rgba(255, 255, 255, .16) }
.appbar-icon { display: inline-flex }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #1976D2; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; border: 1px solid rgba(255, 255, 255, .5) }
.subnav { background: var(--paper); border-bottom: 1px solid var(--divider); display: flex; gap: 4px; overflow-x: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.subnav-btn { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font-weight: 500; text-transform: uppercase; font-size: 13px; letter-spacing: .03em; color: var(--text-2); cursor: pointer; white-space: nowrap }
.subnav-on { color: var(--primary); border-bottom-color: var(--primary) }
.subnav-off { color: #9E9E9E; cursor: default }
.main { padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0 }
.page { display: flex; flex-direction: column; gap: 14px; max-width: 1560px; margin: 0 auto; min-width: 0 }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap }
.page-title { font-size: 22px; font-weight: 500; margin: 0 }
.page-sub { margin: 2px 0 0; color: var(--text-2); max-width: 70ch }
.card { background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; padding: 14px; min-width: 0 }
.card-title { font-size: 15px; font-weight: 500; margin: 0 }

/* controls */
.btn-primary, .btn-outlined, .btn-text { display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; font-weight: 500; letter-spacing: .03em; font-size: 13px; border-radius: 4px; padding: 7px 14px; cursor: pointer; white-space: nowrap }
.btn-primary { background: var(--primary); color: #fff; border: 1px solid var(--primary); box-shadow: 0 1px 2px rgba(0, 0, 0, .2) }
.btn-primary:hover { background: var(--primary-hover) }
.btn-primary:disabled { background: var(--divider); color: #9E9E9E; border-color: var(--divider); box-shadow: none; cursor: not-allowed }
.btn-outlined { background: var(--paper); color: var(--primary); border: 1px solid var(--primary) }
.btn-outlined:disabled { color: #9E9E9E; border-color: var(--divider); cursor: not-allowed }
.btn-text { background: none; border: 1px solid transparent; color: var(--primary); padding-inline: 6px }
.btn-sm { padding: 4px 10px; font-size: 12px }
.icon-btn { background: none; border: 0; color: var(--text-2); cursor: pointer; padding: 4px; border-radius: 4px; display: inline-flex }
.icon-btn:hover { background: var(--page) }
.sel, .inp { border: 1px solid #C4C4C4; border-radius: 4px; padding: 6px 8px; background: var(--paper); font-size: 13px; max-width: 100%; min-width: 0 }
.inp { width: 100% }
.inp-num { width: 80px }
textarea.inp { resize: vertical }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-3) }
.fld > span:first-child { font-weight: 500 }
.fld-inline { flex-direction: row; align-items: center; gap: 8px }
.search { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #C4C4C4; border-radius: 4px; padding: 0 8px; background: var(--paper); color: var(--text-3); min-width: 0 }
.search input { border: 0; outline: 0; padding: 7px 0; background: transparent; min-width: 0; width: 220px; max-width: 100% }
.search-sm { width: 100% }
.search-sm input { width: 100%; padding: 5px 0; font-size: 13px }
.seg-group { display: inline-flex; flex-wrap: wrap; gap: 4px }
.seg { border: 1px solid var(--divider); background: var(--paper); border-radius: 16px; padding: 4px 12px; font-size: 13px; cursor: pointer }
.seg-on { background: var(--primary); color: #fff; border-color: var(--primary) }
.status { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap }
.st-pub { color: var(--ok); background: var(--ok-bg) }
.st-draft { color: var(--warn); background: var(--warn-bg) }
.st-old { color: var(--text-2); background: var(--page) }
.notice { background: #F3F7FC; color: #39475B; border: 1px solid #DCE6F3; border-radius: 4px; padding: 10px 12px; font-size: 13px }

/* library */
.lib-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.lib-card { padding: 0 }
.table-wrap { overflow-x: auto; max-width: 100% }
.lib { border-collapse: collapse; width: 100%; font-size: 13px }
.lib th { background: var(--page); text-align: left; font-weight: 500; padding: 9px 12px; border-bottom: 1px solid var(--divider); white-space: nowrap }
.lib td { padding: 10px 12px; border-bottom: 1px solid var(--divider); vertical-align: top }
.lib-row { cursor: pointer }
.lib-row:hover td { background: #FAFBFD }
.lib-name-cell { min-width: 220px; max-width: 300px }
.lib-name { display: block; font-weight: 500; color: var(--primary) }
.lib-desc { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px }
.lib-formula { min-width: 260px; max-width: 420px }
.mini-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid #C9D6EA; color: var(--metric); background: var(--metric-bg); margin: 0 4px 4px 0; white-space: nowrap }
.mini-plan { border-color: var(--divider); color: var(--text-2); background: var(--page) }
.empty { text-align: center; color: var(--text-3); padding: 24px }
/* checks */
.checks { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px }
.checks-ok { border-left: 4px solid var(--ok) }
.checks-bad { border-left: 4px solid var(--err) }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px }
.chk-ok { color: var(--ok); font-weight: 500 }
.chk-err { color: var(--err) }
.chk-warn { color: var(--warn) }
.chk .ico { margin-top: 1px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: #1E2633; color: #fff; padding: 10px 16px; border-radius: 4px; display: inline-flex; gap: 8px; align-items: center; z-index: 60; font-size: 13.5px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25) }
.toast .ico { color: #6FD08C }


.table-wrap { position: relative }
.sr { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.link-btn { background: none; border: 0; padding: 0; text-align: left; cursor: pointer; font: inherit }
.link-btn:hover { text-decoration: underline }
.st-sched { color: var(--primary); background: var(--primary-wash) }
.dim-tag { display: inline-block; font-size: 12px; font-weight: 500; color: var(--text-2); border: 1px solid var(--divider); border-radius: 10px; padding: 0 8px }
.scope-cell { min-width: 220px; max-width: 300px }
.actions-cell { text-align: right }
.lib td .lib-desc { white-space: normal }

/* builder frame */
.b-head { display: flex; flex-direction: column; gap: 8px }
.b-head > .btn-text { align-self: flex-start; padding-left: 0 }
.b-title-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap }
.b-foot { position: sticky; bottom: 0; z-index: 5; background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; box-shadow: 0 -2px 8px rgba(0, 0, 0, .06); margin-bottom: env(safe-area-inset-bottom, 0px) }
.b-foot-r { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end }

/* stepper: a real sequence, so it is numbered */
.stepper { list-style: none; margin: 4px 0 0; padding: 0; display: flex; gap: 0; background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; overflow-x: auto }
.step { flex: 1 1 0; min-width: 0; position: relative }
.step + .step::before { content: ''; position: absolute; left: 0; top: 50%; width: 1px; height: 60%; transform: translateY(-50%); background: var(--divider) }
.step-btn { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px 9px; cursor: pointer; text-align: left }
.step-btn:disabled { cursor: default }
.step-dot { width: 24px; height: 24px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; border: 1.5px solid #9E9E9E; color: var(--text-3) }
.step-label { font-weight: 500; white-space: nowrap; color: var(--text-3) }
.step-on .step-btn { border-bottom-color: var(--primary) }
.step-on .step-dot { background: var(--primary); border-color: var(--primary); color: #fff }
.step-on .step-label { color: var(--text) }
.step-done .step-dot { background: var(--primary-wash); border-color: var(--primary); color: var(--primary) }
.step-done .step-label { color: var(--text-2) }

/* define */
.define { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start }
.def-sec { display: flex; flex-direction: column; gap: 8px }
.def-sec .hint { margin: 0 }
.define > .def-sec:first-child { grid-column: 1 / -1 }
.def-right { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.inp-lg { font-size: 16px; padding: 9px 10px; max-width: 560px }
.opt-list { display: flex; flex-direction: column; gap: 6px }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--divider); border-radius: 4px; padding: 8px 10px; cursor: pointer; background: var(--paper) }
.opt:hover { border-color: #9DB3D6 }
.opt-on { border-color: var(--primary); background: #F7FAFE; box-shadow: inset 3px 0 0 var(--primary) }
.opt input, .crit input { margin-top: 3px; accent-color: var(--primary) }
.opt-body { display: flex; flex-direction: column; gap: 1px; min-width: 0 }
.opt-title { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; flex-wrap: wrap }
.opt-title .ico { color: var(--metric) }
.opt-meta { font-weight: 400; font-size: 12px; color: var(--text-3); margin-left: 6px }
.opt-desc { display: block; font-size: 12.5px; color: var(--text-3) }
.crit-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.crit { display: flex; gap: 8px; align-items: center; border: 1px solid var(--divider); border-radius: 4px; padding: 8px 10px; cursor: pointer }
.crit-on { border-color: var(--primary); background: #F7FAFE; box-shadow: inset 0 -3px 0 var(--primary) }
.crit-sym { font-size: 22px; font-weight: 500; color: var(--primary); width: 22px; text-align: center; line-height: 1 }
.reads-line { margin: 0; font-size: 13px; color: var(--text-2); background: var(--page); border-radius: 4px; padding: 8px 10px }
.dim-row { display: flex; flex-direction: column; gap: 6px }

/* set targets */
.targets { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 14px; align-items: start }
.inst { display: flex; flex-direction: column; gap: 10px; position: sticky; top: 12px }
.inst-set { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.inst-set legend { font-size: 12px; font-weight: 500; color: var(--text-3); padding: 0; margin-bottom: 4px }
.inst-group { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px }
.inst-group-h { font-size: 12px; color: var(--text-2) }
.chk-line { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; cursor: pointer; padding: 2px 0 }
.chk-line input { margin-top: 3px; accent-color: var(--primary) }
.chk-sub { display: block; font-size: 12px; color: var(--text-3) }
.targets-main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.mx-head { display: flex; justify-content: space-between; gap: 10px; align-items: center }
.mx-head .card-title { display: inline-flex; align-items: center; gap: 4px }
.mx-head .card-title .ico { color: var(--metric) }
.mx-head .hint { margin: 2px 0 0 }

/* the target matrix: the one memorable element */
.mx-block { background: var(--paper); border: 1px solid var(--divider); border-radius: 6px; overflow: hidden; min-width: 0 }
.mx-card { padding: 0 }
.mx-card .mx-block { border: 0 }
.mx-title { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--divider) }
.mx-title-main { font-weight: 500; font-size: 15px }
.mx-title-sub { font-size: 12.5px; color: var(--text-3) }
.mx { border-collapse: collapse; width: 100%; font-size: 13.5px }
.mx thead th { background: #0B3D6E; color: #fff; font-weight: 500; padding: 10px 12px; text-align: center; vertical-align: bottom }
.mx thead th.mx-rowh { text-align: left }
.mx-colh span { display: block; white-space: nowrap }
.mx-colsub { font-size: 11.5px; font-weight: 400; color: #C7D6EA }
.mx td, .mx tbody th { border-bottom: 1px solid var(--divider-2); padding: 8px 12px; vertical-align: middle }
.mx tbody tr:last-child td, .mx tbody tr:last-child th { border-bottom: 0 }
.mx tbody th { text-align: left; font-weight: 500 }
.mx-rowh { min-width: 240px }
.mx-item { min-width: 240px }
.mx-item-name { margin-right: 8px }
.fam-tag { display: inline-block; font-size: 11px; font-weight: 500; color: var(--job); background: var(--job-bg); border-radius: 3px; padding: 1px 6px; white-space: nowrap; vertical-align: 1px }
.mx-default th, .mx-default td { background: var(--primary-wash) }
.mx-default th { color: var(--primary) }
.mx-def-sub { display: block; font-size: 12px; font-weight: 400; color: #39577F }
.mx-def-act { text-align: left }
.mx-def-act .hint { margin-left: 6px }
.mx-cell { text-align: center; width: 1%; white-space: nowrap }
.cell-in { display: inline-flex; align-items: center; gap: 4px; position: relative }
.cell-inp { width: 72px; text-align: center; border: 1px solid #C4C4C4; border-radius: 4px; padding: 7px 6px; background: var(--paper); font-variant-numeric: tabular-nums; font-size: 14px }
.cell-inp:focus { border-color: var(--primary); outline: 2px solid var(--primary-wash) }
.cell-edited .cell-inp { border-color: var(--primary); font-weight: 600; color: var(--primary) }
.cell-edited::after { content: ''; position: absolute; top: -2px; right: -3px; width: 7px; height: 7px; border-radius: 50%; background: var(--primary); border: 1.5px solid var(--paper) }
.cell-unit { font-size: 12px; color: var(--text-3) }
.cell-sym { font-size: 16px; color: var(--primary); font-weight: 500 }
.mx-na { color: #9E9E9E; font-size: 12px }
.mx-ro { font-variant-numeric: tabular-nums; color: var(--text) }
.mx-ro.cell-edited { font-weight: 600; color: var(--primary) }
.mx-ro.cell-edited::after { display: none }
.cell-blank { color: var(--warn) }
.mx-act { width: 1%; text-align: center }
.mx-add { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--divider); background: #FAFBFD }

/* review */
.review { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 14px; align-items: start }
.review-main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.summary { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 6px 14px; margin: 10px 0 0; font-size: 13.5px }
.summary dt { color: var(--text-3) }
.summary dd { margin: 0 }
.owner { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 12px }
.owner .checks { border: 1px solid var(--divider); border-radius: 4px }
.fld-help { font-size: 12px; color: var(--text-3) }

@media (max-width: 1100px) {
  .review { grid-template-columns: minmax(0, 1fr) }
  .owner { position: static }
}
@media (max-width: 900px) {
  .define { grid-template-columns: minmax(0, 1fr) }
  .targets { grid-template-columns: minmax(0, 1fr) }
  .inst { position: static }
}
@media (max-width: 820px) {
  .proto-sub { display: none }
  .search input { width: 100% }
  .lib-tools .search { flex: 1 1 100% }
  .crit-row { grid-template-columns: minmax(0, 1fr) }
  .step-btn { padding: 8px 10px; gap: 6px }
  .step-label { font-size: 13px }
  .summary { grid-template-columns: minmax(0, 1fr) }
  .summary dt { margin-top: 6px }
  .mx-rowh, .mx-item { min-width: 170px }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
/* ===== R2 product models ===== */
.pm { padding: 4px 0 6px; border-bottom: 1px dashed var(--divider-2) }
.pm:last-of-type { border-bottom: 0 }
.pm-line { align-items: flex-start }
.pm-name { font-weight: 500 }
.pm-shifts { display: flex; align-items: center; gap: 4px; margin: 4px 0 0 26px; flex-wrap: wrap }
.pm-runs { font-size: 11.5px; color: var(--text-3); margin-right: 2px }
.pm-sh { border: 1px solid var(--divider); background: var(--paper); border-radius: 10px; padding: 1px 8px; font: inherit; font-size: 11.5px; cursor: pointer; color: var(--text-2) }
.pm-sh-on { background: #E8EFF8; border-color: #9DB6D6; color: #05448E; font-weight: 500 }
.pm-sh:disabled { cursor: not-allowed }
.hint-warn { color: #9A5B00 }
.mtag { display: inline-block; font-size: 10.5px; font-weight: 500; padding: 1px 6px; border-radius: 3px; border: 1px solid; line-height: 1.4; white-space: nowrap }
.mtag-M7A { color: #05448E; border-color: #A9C1E0; background: #EEF4FB }
.mtag-M7B { color: #6B2FA5; border-color: #CDB4E6; background: #F6F0FC }
.mtag-M7C { color: #0E6B5C; border-color: #A3D5CB; background: #ECF8F5 }
.mtag-MLX { color: #7A4B00; border-color: #E2C695; background: #FDF6EA }
.mtag-man { color: var(--text-2); border-color: var(--divider); background: #F5F5F5 }
.row-tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px }
.mx-steph, .mx-step { width: 44px; text-align: center; color: var(--text-3); font-variant-numeric: tabular-nums }
.mx-step { font-weight: 600; font-size: 13px }
.mx-step-var { color: transparent }
.mx-step-var::before { content: '↳'; color: var(--text-3) }
.mx-var { padding-left: 22px !important }
.var-of { display: block; font-size: 11.5px; color: var(--text-3); font-weight: 400 }
.rt { margin: 0 0 10px }
.rt-tog { background: none; border: 0; font: inherit; font-size: 12.5px; color: #05448E; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; padding: 4px 0 }
.rt-t { border-collapse: collapse; font-size: 12px; width: 100% }
.rt-t th, .rt-t td { border: 1px solid var(--divider-2); padding: 5px 7px; text-align: left; vertical-align: top }
.rt-t thead th { background: #F3F6FA; font-weight: 500; color: var(--text-2); white-space: nowrap }
.rt-t tbody th { white-space: nowrap; font-weight: 400; background: var(--paper) }
.rt-sub { display: block; font-size: 11px; color: var(--text-3); margin-top: 2px }
.rt-var { background: #FFF6E5; font-weight: 500 }
.rt-none { background: #FAFAFA }
.rt-upd { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; border: 1px solid #F0D9AE; background: #FFFAF0; color: #6B4A00; padding: 10px 14px; border-radius: 4px; margin: 0 0 12px; font-size: 13px }
.rt-upd > span { flex: 1; min-width: 240px }
.lib-models { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px }
.lib-upd { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: #9A5B00; margin-top: 4px }
.rv-models { display: block }

</style>
