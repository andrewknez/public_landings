<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>2027 Strategy Offsite Pre-Read</title>
<style>
:root{--paper:#F4F6F5;--surface:#FFFFFF;--ink:#0F2340;--ink-2:#4A5A70;--rule:#D6DCE2;--btn:#0F2340;--on-btn:#FFFFFF;--accent:#C98A12;--err:#A8432F;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#0B1424;--surface:#111D31;--ink:#E6EBF2;--ink-2:#A4B1C3;--rule:#26354D;--btn:#9DB4D3;--on-btn:#0B1424;--accent:#E2A93C;--err:#E07E68;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0B1424;--surface:#111D31;--ink:#E6EBF2;--ink-2:#A4B1C3;--rule:#26354D;--btn:#9DB4D3;--on-btn:#0B1424;--accent:#E2A93C;--err:#E07E68;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 "Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;margin-bottom:22px}
.brand svg{width:30px;height:20px}.brand circle{fill:none;stroke:var(--ink);stroke-width:2.2}
h1{font-size:21px;line-height:1.25;margin:0 0 6px}
p{margin:0 0 18px;color:var(--ink-2);font-size:15px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--rule);border-radius:8px;background:var(--paper);color:var(--ink)}
input:focus{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--ink-2)}
button{margin-top:14px;width:100%;font:700 15px "Helvetica Neue",Arial,sans-serif;padding:12px;border:none;border-radius:8px;background:var(--btn);color:var(--on-btn);cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.7;cursor:progress}
.msg{min-height:22px;margin-top:12px;font-size:14px;color:var(--err)}
</style>
</head>
