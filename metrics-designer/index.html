<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Metrics Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600&display=swap">
<style>
/* Covalent Metrics Library and Designer, R1. Tokens follow claude/covalent-prototype-tokens.md: Roboto, Royal Blue app bar, light only. */
:root {
  --primary: #05448E; --primary-wash: #E2ECF9; --primary-hover: #04386F;
  --text: #1C1C1C; --text-2: #4A4F57; --text-3: #6B6F76;
  --page: #F0F0F0; --paper: #FFFFFF; --divider: #E0E0E0; --divider-2: #EEEEEE;
  --ok: #167F36; --ok-bg: #DCFCE5; --warn: #8A4B00; --warn-bg: #FFF2C6; --err: #B00020; --err-bg: #FFF1F2;
  --emp: #0F5FBD; --emp-bg: #E2EFFD; --job: #146C2E; --job-bg: #E2F4E6; --obj: #8A4300; --obj-bg: #FCEEDD; --grp: #5B45B0; --grp-bg: #EEEAFB;
  --metric: #05448E; --metric-bg: #F3F7FC; --attr: #0B5E58;
  --proto: #1E2633; --proto-hi: #F08A24;
  --font: 'Roboto', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  --mono: 'Roboto Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box }
body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.45 }
button, input, select, textarea { font: inherit; color: inherit }
.app { min-height: 100%; display: flex; flex-direction: column }
.ico { flex: none; display: inline-block; vertical-align: -3px }
.rot { transform: rotate(-90deg) }
.min-w-0 { min-width: 0 }
.hint { color: var(--text-3); font-size: 12.5px }
.nowrap { white-space: nowrap }
.ml { margin-left: 6px }
.mt { margin-top: 8px }
code { font-family: var(--mono); font-size: 12px; background: var(--page); padding: 0 4px; border-radius: 3px }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, tr:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px }

/* prototype chrome */
.protobar { background: var(--proto); color: #E7ECF3; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.pb-left, .pb-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.proto-label { font-weight: 700; font-size: 12px; letter-spacing: .05em; color: var(--proto-hi) }
.proto-sub { font-size: 12px; color: #B8C2D1 }
.proto-btn { background: transparent; border: 1px solid #4A5568; color: #E7ECF3; border-radius: 4px; padding: 3px 10px; font-size: 12px; cursor: pointer }
.proto-on, .proto-btn:hover { border-color: var(--proto-hi); color: var(--proto-hi) }
.script { background: #2A3343; color: #E7ECF3; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.script ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; max-width: 980px; font-size: 13px }
.slink { background: none; border: 0; color: var(--proto-hi); text-decoration: underline; cursor: pointer; margin-left: 8px; font-size: 13px; padding: 0 }

.appbar { background: var(--primary); color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.ab-left, .ab-right { display: flex; align-items: center; gap: 4px; flex-wrap: wrap }
.ab-right { gap: 12px }
.env-pill { background: #1F87ED; font-weight: 700; font-size: 11px; padding: 3px 8px; border-radius: 12px; letter-spacing: .05em; margin-right: 8px }
.appbar-menu { display: inline-flex; align-items: center; gap: 2px; padding: 4px 8px; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; border-radius: 4px }
.appbar-on { background: rgba(255, 255, 255, .16) }
.appbar-icon { display: inline-flex }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #1976D2; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; border: 1px solid rgba(255, 255, 255, .5) }
.subnav { background: var(--paper); border-bottom: 1px solid var(--divider); display: flex; gap: 4px; overflow-x: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.subnav-btn { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 12px 9px; font-weight: 500; text-transform: uppercase; font-size: 13px; letter-spacing: .03em; color: var(--text-2); cursor: pointer; white-space: nowrap }
.subnav-on { color: var(--primary); border-bottom-color: var(--primary) }
.subnav-off { color: #9E9E9E; cursor: default }
.main { padding-block: 18px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0 }
.page { display: flex; flex-direction: column; gap: 14px; max-width: 1560px; margin: 0 auto; min-width: 0 }
.page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap }
.page-title { font-size: 22px; font-weight: 500; margin: 0 }
.page-sub { margin: 2px 0 0; color: var(--text-2); max-width: 70ch }
.card { background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; padding: 14px; min-width: 0 }
.card-title { font-size: 15px; font-weight: 500; margin: 0 }

/* controls */
.btn-primary, .btn-outlined, .btn-text { display: inline-flex; align-items: center; gap: 6px; text-transform: uppercase; font-weight: 500; letter-spacing: .03em; font-size: 13px; border-radius: 4px; padding: 7px 14px; cursor: pointer; white-space: nowrap }
.btn-primary { background: var(--primary); color: #fff; border: 1px solid var(--primary); box-shadow: 0 1px 2px rgba(0, 0, 0, .2) }
.btn-primary:hover { background: var(--primary-hover) }
.btn-primary:disabled { background: var(--divider); color: #9E9E9E; border-color: var(--divider); box-shadow: none; cursor: not-allowed }
.btn-outlined { background: var(--paper); color: var(--primary); border: 1px solid var(--primary) }
.btn-outlined:disabled { color: #9E9E9E; border-color: var(--divider); cursor: not-allowed }
.btn-text { background: none; border: 1px solid transparent; color: var(--primary); padding-inline: 6px }
.btn-sm { padding: 4px 10px; font-size: 12px }
.icon-btn { background: none; border: 0; color: var(--text-2); cursor: pointer; padding: 4px; border-radius: 4px; display: inline-flex }
.icon-btn:hover { background: var(--page) }
.sel, .inp { border: 1px solid #C4C4C4; border-radius: 4px; padding: 6px 8px; background: var(--paper); font-size: 13px; max-width: 100%; min-width: 0 }
.inp { width: 100% }
.inp-num { width: 80px }
textarea.inp { resize: vertical }
.fld { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-3) }
.fld > span:first-child { font-weight: 500 }
.fld-inline { flex-direction: row; align-items: center; gap: 8px }
.search { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #C4C4C4; border-radius: 4px; padding: 0 8px; background: var(--paper); color: var(--text-3); min-width: 0 }
.search input { border: 0; outline: 0; padding: 7px 0; background: transparent; min-width: 0; width: 220px; max-width: 100% }
.search-sm { width: 100% }
.search-sm input { width: 100%; padding: 5px 0; font-size: 13px }
.seg-group { display: inline-flex; flex-wrap: wrap; gap: 4px }
.seg { border: 1px solid var(--divider); background: var(--paper); border-radius: 16px; padding: 4px 12px; font-size: 13px; cursor: pointer }
.seg-on { background: var(--primary); color: #fff; border-color: var(--primary) }
.status { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 10px; white-space: nowrap }
.st-pub { color: var(--ok); background: var(--ok-bg) }
.st-draft { color: var(--warn); background: var(--warn-bg) }
.st-old { color: var(--text-2); background: var(--page) }
.notice { background: #F3F7FC; color: #39475B; border: 1px solid #DCE6F3; border-radius: 4px; padding: 10px 12px; font-size: 13px }

/* library */
.lib-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.lib-card { padding: 0 }
.table-wrap { overflow-x: auto; max-width: 100% }
.lib { border-collapse: collapse; width: 100%; font-size: 13px }
.lib th { background: var(--page); text-align: left; font-weight: 500; padding: 9px 12px; border-bottom: 1px solid var(--divider); white-space: nowrap }
.lib td { padding: 10px 12px; border-bottom: 1px solid var(--divider); vertical-align: top }
.lib-row { cursor: pointer }
.lib-row:hover td { background: #FAFBFD }
.lib-name-cell { min-width: 220px; max-width: 300px }
.lib-name { display: block; font-weight: 500; color: var(--primary) }
.lib-desc { display: block; font-size: 12px; color: var(--text-3); margin-top: 2px }
.lib-formula { min-width: 260px; max-width: 420px }
.mini-chip { display: inline-flex; align-items: center; gap: 3px; font-size: 12px; padding: 1px 7px; border-radius: 10px; border: 1px solid #C9D6EA; color: var(--metric); background: var(--metric-bg); margin: 0 4px 4px 0; white-space: nowrap }
.mini-plan { border-color: var(--divider); color: var(--text-2); background: var(--page) }
.empty { text-align: center; color: var(--text-3); padding: 24px }

/* formula tokens: entity, attribute, metric each have their own look */
.fchips { font-family: var(--mono); font-size: 12px; line-height: 2; display: inline }
.chip-tk { display: inline-flex; align-items: center; gap: 2px; padding: 0 6px; border-radius: 10px; margin: 0 1px; line-height: 1.7 }
.tk-ent-emp, .chip-tk.tk-ent-emp { color: var(--emp) }
.chip-tk.tk-ent-emp { background: var(--emp-bg) }
.tk-ent-job { color: var(--job) } .chip-tk.tk-ent-job { background: var(--job-bg) }
.tk-ent-obj { color: var(--obj) } .chip-tk.tk-ent-obj { background: var(--obj-bg) }
.tk-ent-grp { color: var(--grp) } .chip-tk.tk-ent-grp { background: var(--grp-bg) }
.tk-metric { color: var(--metric); font-weight: 600 }
.chip-tk.tk-metric { background: var(--paper); border: 1px solid var(--metric) }
.tk-attr { color: var(--attr) }
.chip-tk.tk-attr { background: #E7F4F2 }
.tk-fn { color: var(--text); font-weight: 700 }
.tk-kw { color: #7A5AA6; font-weight: 600 }
.tk-lit { color: #A33A00 }
.tk-op { color: var(--text-2) }
.tk-unknown { color: var(--err); text-decoration: wavy underline var(--err) }
.tk-errat { background: var(--err-bg); box-shadow: inset 0 -2px 0 var(--err) }

/* designer */
.d-head { display: flex; flex-direction: column; gap: 6px }
.d-head > .btn-text { align-self: flex-start; padding-left: 0 }
.d-title-row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start }
.d-name { font-size: 22px; font-weight: 500; border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; margin-left: -7px; background: transparent; width: min(560px, 100%) }
.d-name:hover { border-color: var(--divider) }
.d-name:focus { border-color: var(--primary); background: var(--paper) }
.d-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 4px }
.d-actions { display: flex; gap: 8px; flex-wrap: wrap }
.d-grid { display: grid; grid-template-columns: 270px minmax(0, 1fr) 400px; gap: 14px; align-items: start }
.d-main { display: flex; flex-direction: column; gap: 14px; min-width: 0 }

/* catalog */
.catalog { padding: 0; position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column }
.cat-head { padding: 12px 12px 10px; border-bottom: 1px solid var(--divider-2); display: flex; flex-direction: column; gap: 6px }
.cat-head .hint { margin: 0 }
.cat-body { overflow-y: auto; padding: 6px 0 12px }
.cat-sec-label { font-size: 12px; font-weight: 500; color: var(--text-3); padding: 10px 12px 4px }
.cat-group ul, .cat-body > ul { list-style: none; margin: 0; padding: 0 }
.cat-toggle { width: 100%; text-align: left; background: none; border: 0; padding: 5px 10px; display: flex; align-items: center; gap: 6px; font-weight: 500; cursor: pointer; font-size: 13px }
.cat-toggle:hover { background: var(--page) }
.cat-key { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--text-3) }
.ent-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block }
.ent-emp { background: var(--emp) } .ent-job { background: var(--job) } .ent-obj { background: var(--obj) } .ent-grp { background: var(--grp) }
.cat-src-group { padding-left: 8px }
.cat-src-head { font-size: 11.5px; color: var(--text-3); padding: 4px 12px 2px 22px }
.cat-item { width: 100%; text-align: left; background: none; border: 0; padding: 4px 12px 5px 30px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 0 8px }
.cat-item:hover { background: #F3F7FC }
.cat-dim { opacity: .45 }
.cat-name { font-family: var(--mono); font-size: 12.5px; color: var(--attr); display: inline-flex; align-items: center; gap: 2px; overflow-wrap: anywhere }
.cat-metric { color: var(--metric); font-weight: 600 }
.cat-type { font-size: 11px; color: var(--text-3); align-self: center }
.cat-desc { grid-column: 1 / -1; font-size: 12px; color: var(--text-3); line-height: 1.35 }
.cat-src { color: #8A8F96 }

/* calculation */
.calc-card { display: flex; flex-direction: column; gap: 12px }
.calc-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap }
.guided { display: flex; flex-direction: column; gap: 12px }
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px }
.sel-inline { font-size: 14px; padding: 5px 8px; border-color: #9DB3D6; background: #F7FAFE; color: var(--primary); font-weight: 500 }
.sel-strong { font-weight: 700 }
.s-word { color: var(--text-2) }
.s-check { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text-2) }
.conds { display: flex; flex-direction: column; gap: 8px; border-left: 3px solid var(--primary-wash); padding-left: 12px }
.conds-head { font-size: 13px; color: var(--text-2) }
.cond { display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.cond .btn-text { align-self: flex-start }
.conds > .btn-text { align-self: flex-start; padding-left: 0 }
.feditor { position: relative }
.fe-wrap { position: relative; border: 1px solid #9DB3D6; border-radius: 4px; background: var(--paper) }
.fe-wrap:focus-within { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary) }
.fe-pre, .fe-ta { margin: 0; padding: 12px; font-family: var(--mono); font-size: 14px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; min-height: 80px; border: 0; letter-spacing: 0 }
.fe-pre { pointer-events: none; color: var(--text); overflow: hidden }
.fe-ta { position: absolute; inset: 0; width: 100%; height: 100%; resize: none; background: transparent; color: transparent; caret-color: var(--text); outline: 0 }
.fe-ta::selection { background: rgba(5, 68, 142, .2) }
.ac { position: absolute; left: 0; right: 0; top: 100%; margin: 4px 0 0; padding: 4px 0; list-style: none; background: var(--paper); border: 1px solid var(--divider); border-radius: 4px; box-shadow: 0 6px 18px rgba(0, 0, 0, .14); z-index: 20; max-height: 280px; overflow-y: auto }
.ac-item { width: 100%; text-align: left; background: none; border: 0; padding: 6px 12px; display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: baseline; cursor: pointer }
.ac-on, .ac-item:hover { background: #F3F7FC }
.ac-label { font-family: var(--mono); font-size: 13px; font-weight: 500 }
.ac-kind { font-size: 11px; color: var(--text-3) }
.ac-desc { font-size: 12px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.reads { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; background: var(--page); border-radius: 4px; padding: 8px 10px }
.reads-l { font-size: 12px; color: var(--text-3); font-weight: 500 }
.reads-text { font-size: 13px; color: var(--text-2) }
.rollup-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--divider-2); padding-top: 10px }

/* checks */
.checks { display: flex; flex-direction: column; gap: 6px; padding: 10px 14px }
.checks-ok { border-left: 4px solid var(--ok) }
.checks-bad { border-left: 4px solid var(--err) }
.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 13px }
.chk-ok { color: var(--ok); font-weight: 500 }
.chk-err { color: var(--err) }
.chk-warn { color: var(--warn) }
.chk .ico { margin-top: 1px }

/* lineage: the one memorable element */
.lineage { display: flex; flex-direction: column; gap: 10px }
.lin { display: grid; grid-template-columns: minmax(0, 1fr) 28px minmax(0, 1fr) 28px minmax(0, 1fr); gap: 0; align-items: stretch }
.lin-col { display: flex; flex-direction: column; gap: 6px; min-width: 0 }
.lin-h { font-size: 12px; color: var(--text-3); font-weight: 500 }
.lin-chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid #C9D6EA; background: var(--metric-bg); color: var(--metric); border-radius: 14px; padding: 3px 10px; font-size: 12.5px; font-weight: 500; align-self: flex-start; max-width: 100% }
.lin-chip-self { background: var(--primary); color: #fff; border-color: var(--primary) }
.lin-plan { background: var(--page); color: var(--text-2); border-color: var(--divider) }
.lin-v { font-size: 11px; font-weight: 400; opacity: .8; margin-left: 2px }
.lin-arrow { position: relative }
.lin-arrow::before { content: ''; position: absolute; left: 4px; right: 6px; top: 30px; height: 1.5px; background: #9DB3D6 }
.lin-arrow::after { content: ''; position: absolute; right: 2px; top: 26px; border: 5px solid transparent; border-left: 6px solid #9DB3D6 }
.pin-issue { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; font-size: 12.5px; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 6px 8px }
.versions { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.versions li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 13px }
.versions li .min-w-0 { display: flex; flex-direction: column; gap: 2px }

/* preview */
.preview { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 24px); overflow-y: auto }
.pv-head { display: flex; flex-direction: column; gap: 8px }
.pv-controls { display: flex; flex-wrap: wrap; gap: 6px }
.pv-empty { color: var(--text-3); padding: 20px 0; text-align: center }
.pv-total { display: flex; flex-direction: column; gap: 2px; border-bottom: 1px solid var(--divider-2); padding-bottom: 10px }
.pv-num { font-size: 32px; font-weight: 500; color: var(--primary); line-height: 1.1; font-variant-numeric: tabular-nums }
.pv-cap { font-size: 12.5px; color: var(--text-2) }
.pv-alt { font-size: 12.5px; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 4px 8px; margin-top: 4px }
.pv-table { border-collapse: collapse; width: 100%; font-size: 13px }
.pv-table th { text-align: left; font-weight: 500; color: var(--text-3); font-size: 12px; padding: 4px 6px; border-bottom: 1px solid var(--divider) }
.pv-table td { padding: 6px; border-bottom: 1px solid var(--divider-2); vertical-align: top }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
.pv-row { cursor: pointer }
.pv-row:hover td, .pv-open td { background: #F7FAFE }
.pv-row td:first-child { display: flex; gap: 4px; align-items: center }
.pv-val { font-weight: 600 }
.pv-na td { color: var(--text-3) }
.na { color: var(--text-3); font-weight: 500; border-bottom: 1px dotted var(--text-3) }
.pv-detail td { background: #FAFBFD; padding: 8px 10px 12px 22px }
.na-why { margin: 0 0 6px; color: var(--warn); font-size: 12.5px }
.dd { display: grid; grid-template-columns: 1fr 1fr; gap: 12px }
.dd-h { font-size: 12px; font-weight: 500; color: var(--text-2); margin-bottom: 4px }
.dd-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12.5px }
.dd-list li { display: flex; flex-direction: column }
.pname { font-weight: 500 }
.pv-foot { margin: 0 }

/* modal and toast */
.modal-wrap { position: fixed; inset: 0; background: rgba(20, 28, 40, .45); z-index: 50; display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.modal { background: var(--paper); border-radius: 6px; width: min(520px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 10px 40px rgba(0, 0, 0, .3) }
.modal-title { margin: 0; font-size: 18px; font-weight: 500 }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px }
.dep-list { margin: 6px 0 0; padding-left: 18px }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: #1E2633; color: #fff; padding: 10px 16px; border-radius: 4px; display: inline-flex; gap: 8px; align-items: center; z-index: 60; font-size: 13.5px; box-shadow: 0 6px 18px rgba(0, 0, 0, .25) }
.toast .ico { color: #6FD08C }

@media (max-width: 1280px) {
  .d-grid { grid-template-columns: 250px minmax(0, 1fr) }
  .preview { grid-column: 1 / -1; position: static; max-height: none }
}
@media (max-width: 820px) {
  .d-grid { grid-template-columns: minmax(0, 1fr) }
  .catalog { position: static; max-height: 360px }
  .lin { grid-template-columns: minmax(0, 1fr); gap: 10px }
  .lin-arrow { display: none }
  .dd { grid-template-columns: 1fr }
  .proto-sub { display: none }
  .search input { width: 100% }
  .lib-tools .search { flex: 1 1 100% }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
