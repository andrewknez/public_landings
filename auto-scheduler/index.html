<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auto-schedule r7, Planning Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap">
<style>
/* Layout: Covalent product chrome (MUI-style, light only) with a stepped Auto-schedule workspace inside a white paper.
   Single light theme on purpose: the product has no dark mode, so every color is set explicitly. */
:root {
  --primary: #05448E;
  --primary-wash: #E2ECF9;
  --ai: #2B63B5;
  --ai-wash: #E2EFFD;
  --text: #1C1C1C;
  --muted: #5F6672;
  --page: #F0F0F0;
  --paper: #FFFFFF;
  --divider: #E0E0E0;
  --head: #F5F6F8;
  --good: #167F36; --good-bg: #DCFCE5;
  --warn: #B74E06; --warn-bg: #FFF2C6;
  --bad: #B00020; --bad-bg: #FFD6D9;
  --renew: #7540E7; --renew-bg: #EFE8FD;
  --proto: #1E2633; --proto-hi: #F59E0B;
  --font: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box }
body { background: var(--page); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.4 }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted); font-weight: 400 }
.small { font-size: 12px }
.sub { display: block; font-size: 11px; color: var(--muted); font-weight: 400 }
.spacer { flex: 1 }
button { font-family: inherit }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px }

.proto { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; background: var(--proto); color: #D6DCE5; font-size: 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.proto b { color: var(--proto-hi) }
.proto button { margin-left: auto; background: transparent; color: #fff; border: 1px solid #4A5568; border-radius: 4px; padding: 2px 10px; cursor: pointer }
.appbar { display: flex; align-items: center; gap: 14px; background: var(--primary); color: #fff; height: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.brand { font-weight: 700; letter-spacing: .02em; font-size: 16px }
.env { background: #1F87ED; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600 }
.appbar nav { display: flex; gap: 18px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em }
.appbar nav span { opacity: .8 }
.appbar nav .on { opacity: 1; font-weight: 600; border-bottom: 2px solid #fff; padding-bottom: 2px }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #1976D2; display: grid; place-items: center; font-size: 12px; font-weight: 600 }

.main { padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.paper { background: var(--paper); border-radius: 4px; box-shadow: 0 1px 3px rgba(0,0,0,.12); padding: 16px; position: relative; min-width: 0 }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; margin-bottom: 12px }
h1 { font-size: 22px; font-weight: 400; margin: 0; text-wrap: balance }
.objname { display: block; font-size: 14px; color: var(--muted); margin-top: 2px }
h2 { font-size: 15px; font-weight: 500; margin: 0 0 12px }
h3 { font-size: 13px; font-weight: 500; margin: 16px 0 8px }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.search { display: flex; gap: 8px; align-items: center; border: 1px solid #C4C4C4; border-radius: 4px; padding: 6px 10px; color: #8A8F98; min-width: 0; width: 240px; max-width: 100% }
.search span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis }

.btn { display: inline-flex; align-items: center; gap: 6px; border-radius: 4px; padding: 6px 12px; font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .03em; cursor: pointer; border: 1px solid transparent; background: none; white-space: nowrap }
.btn:disabled { cursor: not-allowed; opacity: .5 }
.btn-primary { background: var(--primary); color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2) }
.btn-primary:disabled { background: var(--divider); color: #9E9E9E; opacity: 1; box-shadow: none }
.btn-out { border-color: var(--primary); color: var(--primary) }
.btn-text { color: var(--primary); padding: 4px 6px }
.btn-ai { background: var(--ai-wash); color: var(--ai); border-color: var(--ai) }
.btn-ai:not(:disabled):hover { background: var(--ai); color: #fff }
.btn-ai.big { width: 100%; justify-content: center; padding: 10px; font-size: 13px; background: var(--ai); color: #fff; margin-top: 12px }
.btn.inv { color: #fff }
.iconbtn { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px; border-radius: 4px }
.iconbtn:hover { background: var(--head); color: var(--bad) }
.crumb { padding-left: 0; margin-bottom: 4px }

.filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px }
.fcol { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.fcol label, .flabel { font-size: 12px; font-weight: 500 }
.fsel { border: 1px solid var(--primary); color: var(--primary); border-radius: 4px; padding: 5px 8px; font-size: 11px; font-weight: 500; text-transform: uppercase; background: var(--paper); max-width: 260px; font-family: inherit }
.fsel.on { background: var(--primary); color: #fff }
.fsel.fake { display: inline-block }

.hint { display: flex; gap: 8px; align-items: flex-start; background: var(--ai-wash); color: #1F3D66; border-radius: 4px; padding: 8px 12px; margin-bottom: 10px }
.hint svg { color: var(--ai); flex: none; margin-top: 1px }
.hint-plain { background: var(--head); color: var(--muted) }
.hint-plain svg { color: var(--muted) }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--divider); margin-bottom: 10px }
.tab { padding: 8px 2px; font-size: 12px; font-weight: 500; text-transform: uppercase; color: var(--muted) }
.tab.on { color: var(--primary); border-bottom: 2px solid var(--primary) }
.subtabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-bottom: 8px }
.seg { display: inline-flex; background: var(--head); border-radius: 4px; padding: 3px; flex-wrap: wrap }
.segb { border: 0; background: none; padding: 5px 10px; font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--primary); border-radius: 3px; cursor: pointer }
.segb.on { background: var(--paper); box-shadow: 0 1px 2px rgba(0,0,0,.15) }

.tablewrap { overflow-x: auto; min-width: 0 }
table { border-collapse: collapse; width: 100% }
.grid th { background: var(--head); text-align: left; font-weight: 500; font-size: 12px; padding: 10px; border-bottom: 1px solid var(--divider); white-space: nowrap }
.grid td { padding: 9px 10px; border-bottom: 1px solid var(--divider); vertical-align: middle; white-space: nowrap }
.grid tr.flash td { animation: flash 2.4s ease-out }
@keyframes flash { from { background: var(--ai-wash) } to { background: transparent } }
.grid .pin { position: sticky; right: 0; background: var(--paper); border-left: 1px solid var(--divider) }
.grid th.pin { background: var(--head) }
.lnk { color: var(--primary); cursor: pointer; text-decoration: none }
.lnk.act { display: inline-flex; gap: 4px; align-items: center; font-size: 11px; font-weight: 500; text-transform: uppercase }
.empty { text-align: center; color: var(--muted); padding: 24px }
.pager { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; padding-top: 10px }
.pg { display: flex; gap: 8px; align-items: center }

.chip { display: inline-flex; align-items: center; border-radius: 4px; padding: 2px 6px; font-size: 11px; font-weight: 600; white-space: nowrap }
.chip-plain { background: var(--head); color: var(--muted) }
.chip-good { background: var(--good-bg); color: var(--good) }
.chip-warn { background: var(--warn-bg); color: var(--warn) }
.chip-bad { background: var(--bad-bg); color: var(--bad) }
.chip-renew { background: var(--renew-bg); color: var(--renew) }
.chip-zone { background: var(--primary-wash); color: var(--primary) }
.sched { display: inline-block; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 600 }
.sched-unscheduled { background: #EEEEEE; color: #424242 }
.sched-draft { border: 1px dashed var(--primary); color: var(--primary); background: var(--paper) }
.sched-scheduled { background: var(--primary-wash); color: var(--primary) }
.sched-completed { background: var(--good-bg); color: var(--good) }
.ostat { display: inline-block; border-radius: 4px; padding: 2px 7px; font-size: 11px; font-weight: 600 }
.ostat-assigned { background: var(--primary-wash); color: #0F5FBD }
.ostat-inprogress { background: var(--warn-bg); color: var(--warn) }
.ostat-active { background: var(--good-bg); color: var(--good) }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: #263238; color: #fff; border-radius: 4px; padding: 10px 14px; display: flex; gap: 10px; align-items: center; box-shadow: 0 4px 12px rgba(0,0,0,.25); max-width: calc(100% - 32px); z-index: 5 }
.toast svg { color: #7EE2A0; flex: none }

.stepper { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; margin: 0; padding: 0; align-self: center }
.stepper li { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; font-weight: 500 }
.stepper .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--divider); color: var(--muted); display: grid; place-items: center; font-size: 11px }
.stepper li.on { color: var(--text) }
.stepper li.on .dot { background: var(--primary); color: #fff }
.stepper li.done .dot { background: var(--good-bg); color: var(--good) }

.card { border: 1px solid var(--divider); border-radius: 4px; padding: 14px; background: var(--paper); min-width: 0 }
.two { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0 }
.field.wide { grid-column: 1 / -1 }
.field label, .flabel2 { font-size: 12px; color: var(--muted) }
input[type=number], input[type=date], .field input, select { font-family: inherit; font-size: 13px; color: var(--text); border: 1px solid #C4C4C4; border-radius: 4px; padding: 7px 8px; background: var(--paper); min-width: 0; max-width: 100% }
input[readonly] { background: var(--head); color: var(--muted) }
.help { font-size: 11px; color: var(--muted) }
.cb { display: flex; gap: 6px; align-items: center; font-size: 13px; padding-top: 6px }
.reslist { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px }
.res { display: flex; gap: 8px; align-items: center; border: 1px solid var(--divider); border-radius: 4px; padding: 8px 10px; cursor: pointer }
.res:has(input:checked) { border-color: var(--primary); background: #F7FAFE }
.res .rn { flex: 1; min-width: 0; font-weight: 500 }
.res .rb { font-size: 11px; color: var(--muted); text-align: right }
.side h2 { margin-bottom: 10px }
.kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px }
.kpis div, .kstrip div { display: flex; flex-direction: column; gap: 2px }
.kl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500 }
.kv { font-size: 20px; font-weight: 400 }
.kv.warn { color: var(--warn) } .kv.bad { color: var(--bad) }
.mini th { text-align: left; font-size: 11px; font-weight: 500; color: var(--muted); padding: 6px 4px; border-bottom: 1px solid var(--divider) }
.mini td { padding: 6px 4px; border-bottom: 1px solid var(--divider) }
.mini .r { text-align: right }
.mini.wide td, .mini.wide th { padding: 8px; white-space: nowrap }
.warnt { color: var(--warn); font-weight: 600 }
.zones { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 }
.cap { border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; margin-top: 8px }
.cap.ok { background: var(--good-bg); color: var(--good) }
.cap.short { background: var(--warn-bg); color: var(--warn) }
.rules ol { margin: 0; padding-left: 18px; color: var(--muted); font-size: 12px; display: grid; gap: 4px }

.running { display: flex; gap: 14px; align-items: center; padding: 40px 16px; justify-content: center }
.running div { display: flex; flex-direction: column; gap: 2px }
.spin { width: 26px; height: 26px; border-radius: 50%; border: 3px solid var(--ai-wash); border-top-color: var(--ai); animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }
@media (prefers-reduced-motion: reduce) { .spin, .grid tr.flash td { animation: none } }

.kstrip { display: flex; flex-wrap: wrap; gap: 12px 28px; padding: 10px 14px; background: var(--head); border-radius: 4px; margin-bottom: 12px }
.banner { border-radius: 4px; padding: 10px 12px; margin-bottom: 12px }
.banner.warn { background: var(--warn-bg); color: #7A3604 }
.review { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start }
.dlist { display: flex; flex-direction: column; gap: 10px }
.dcard { border: 1px dashed var(--primary); border-radius: 4px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--paper); transition: background .15s }
.dcard.hot { background: #F3F8FF }
.dcard header { display: flex; gap: 8px; align-items: center }
.when { font-weight: 500 }
.drow { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; align-items: center }
.drow label, .drow .lab { font-size: 12px; color: var(--muted) }
.drow select { padding: 4px 6px; font-size: 12px }
.note.warn { font-size: 11px; color: var(--warn); background: var(--warn-bg); border-radius: 4px; padding: 4px 6px }
.dfoot { display: flex; justify-content: space-between; border-top: 1px solid var(--divider); padding-top: 4px }
.why { background: var(--head); border-radius: 4px; padding: 8px 10px; font-size: 12px }
.why p { margin: 0 0 6px }
.why ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 6px }
.why li { color: var(--muted) }
.why li span { display: block; color: var(--text); font-weight: 500 }
.tlcard { padding: 12px }
.tlhead { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: baseline }
.legend { display: flex; gap: 12px; font-size: 11px; color: var(--muted) }
.legend span { display: inline-flex; gap: 4px; align-items: center }
.lg { display: inline-block; width: 14px; height: 10px; border-radius: 2px }
.lg.booked { background: #BFD4EE }
.lg.draft { border: 1px dashed var(--primary); background: var(--paper) }
.lg.shift { width: 2px; background: #B0B7C3 }
.tlwrap { overflow-x: auto }
.tl { display: flex; flex-direction: column }
.trow { display: grid; grid-template-columns: 170px; grid-auto-flow: column; grid-auto-columns: minmax(104px, 1fr); border-bottom: 1px solid var(--divider); min-height: 38px }
.tlabel { padding: 6px 8px 6px 0; font-size: 12px; font-weight: 500 }
.tcell { position: relative; border-left: 1px solid var(--divider) }
.tcell.th { padding: 4px 6px 14px; font-size: 11px; color: var(--muted) }
.tcell.th b { color: var(--text) }
.axis { position: absolute; left: 0; right: 0; bottom: 1px; display: flex; justify-content: space-between; padding: 0 3px; font-size: 9px; color: #8A8F98 }
.axis i { font-style: normal }
.axis i:nth-child(2) { position: absolute; left: 50%; transform: translateX(-50%) }
.thead { min-height: 0 }
.tgroup { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 10px 0 4px; border-bottom: 1px solid var(--divider) }
.shiftline { position: absolute; top: 0; bottom: 0; width: 1px; background: #D5DAE1 }
.blk { position: absolute; top: 7px; bottom: 7px; border-radius: 3px; font-size: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; overflow: hidden }
.blk.booked { background: #BFD4EE }
.blk.draft { border: 1.5px dashed var(--primary); background: var(--paper); color: var(--primary); cursor: default }
.blk.draft.hot { background: var(--primary); color: #fff; border-style: solid }

.footer { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid var(--divider); margin-top: 16px; padding-top: 12px }
.footer.flat { margin-top: 12px }
.lede { color: var(--muted); margin: 0 0 12px; max-width: 72ch }
.fill { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start }
.slist { display: flex; flex-direction: column; gap: 12px; min-width: 0 }
.scard { padding: 0 }
.scard header { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--divider); background: var(--head) }
.seatct { margin-left: auto; font-weight: 600; color: var(--primary) }
.seatct.full { color: var(--good) }
.seats { table-layout: fixed; min-width: 760px }
.seats td { padding: 7px 12px; overflow: hidden; text-overflow: ellipsis; border-bottom: 1px solid var(--divider); vertical-align: middle; white-space: nowrap }
.seats tr:last-child td { border-bottom: 0 }
.seats .notes { display: flex; flex-wrap: wrap; gap: 4px; white-space: normal }
.seats select { width: 100% }
.seats .r { text-align: right }
.seats select { font-size: 12px; padding: 4px 6px }
.openseat td { color: #8A8F98; font-style: italic; background: repeating-linear-gradient(135deg, var(--paper) 0 8px, #FAFBFC 8px 16px) }
.pool { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.pool li { border: 1px solid var(--divider); border-radius: 4px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px }
.prow { display: flex; justify-content: space-between; gap: 8px; align-items: center }
.why2 { font-size: 12px; color: var(--warn) }
.pool select { font-size: 12px; padding: 4px 6px }
.confirm { max-width: 980px }
.effects { margin: 14px 0 0; padding-left: 18px; display: grid; gap: 4px }

@media (max-width: 1100px) {
  .two, .fill, .review { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 600px) {
  .appbar nav { display: none }
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)) }
  .reslist { grid-template-columns: minmax(0, 1fr) }
}

:root { --free: #167F36; --free-bg: #DCFCE5; --faint: #8A8F98; --off: #9FBDE3; --along: #D6E4F6; --shift: #EDEFF2; --leave: #F7D58A }
/* Status dots: the same four states everywhere */
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none }
.dot-free { background: var(--free) }
.dot-offshift { background: #fff; border: 1.5px solid var(--faint) }
.dot-booked { background: var(--bad) }
.dot-leave { background: #D08A00 }
.t-free { color: var(--free) }
.t-offshift { color: var(--muted) }
.t-booked { color: var(--bad) }
.t-leave { color: #8A5A00 }

/* The day strip */
.strip { position: relative; background: var(--paper); border-radius: 3px; overflow: hidden; border: 1px solid var(--divider) }
.strip-sm { height: 10px; margin: 4px 0 }
.strip-md { height: 18px; margin: 4px 0 }
.strip-lg { height: 40px; border: 0; border-radius: 0 }
.strip.clickable { cursor: copy }
.strip .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: #D5DAE1 }
.seg.offshift { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, var(--shift) 0 4px, #F8F9FA 4px 8px) }
.strip .seg { position: absolute; top: 0; bottom: 0; padding: 0; border-radius: 0 }
.seg.leave { background: repeating-linear-gradient(135deg, var(--leave) 0 5px, #FFF4D6 5px 10px); display: flex; align-items: center; padding-left: 6px }
.seg.leave em { font-style: normal; font-size: 11px; font-weight: 500; color: #6B4500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.seg.sess { border: 0; cursor: default; display: flex; align-items: center; overflow: hidden; text-align: left }
.strip-lg .seg.sess { top: 5px; bottom: 5px; border-radius: 3px; cursor: pointer; padding: 0 5px }
.seg.sess.off { background: var(--off); border-left: 3px solid var(--primary) }
.seg.sess.alongside { background: repeating-linear-gradient(90deg, var(--along) 0 6px, #E9F0FA 6px 12px); border-left: 3px solid #5B87C2 }
.seg.sess.draft { background: var(--paper); border: 1.5px dashed var(--primary) }
.seg.sess.conflict { box-shadow: inset 0 0 0 2px var(--bad) }
.seg.sess .sl { font-size: 11px; font-weight: 500; color: #0D2C57; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.strip-lg .seg.sess:hover { filter: brightness(.96) }
.seg.win { z-index: 2; background: transparent; pointer-events: none }
.win-free { box-shadow: inset 0 0 0 2px var(--free); background: rgba(23,162,65,.12) }
.win-offshift { box-shadow: inset 0 0 0 2px var(--faint) }
.win-booked { box-shadow: inset 0 0 0 2px var(--bad); background: rgba(176,0,32,.10) }
.win-leave { box-shadow: inset 0 0 0 2px #B07400 }
.axis { position: relative; display: flex; justify-content: space-between; font-size: 10px; color: var(--faint); margin-top: 2px }
.axis .mid { position: absolute; left: 50%; transform: translateX(-50%) }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 11.5px; color: var(--muted); margin-bottom: 10px; align-items: center }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend .hint { margin-left: auto; color: var(--faint) }
.lg { display: inline-block; width: 18px; height: 10px; border-radius: 2px }
.lg-off { background: var(--off); border-left: 3px solid var(--primary) }
.lg-along { background: repeating-linear-gradient(90deg, var(--along) 0 4px, #E9F0FA 4px 8px); border-left: 3px solid #5B87C2 }

/* r2 additions */

.g { grid-template-columns: 180px repeat(var(--cols), minmax(104px, 1fr)); min-width: calc(180px + var(--cols) * 104px) }
.strip-lg { height: 34px }
.seg.sess.draft { z-index: 1 }

.seg.sess.draft.hot .sl { color: #fff }
.strip-lg .seg.sess { justify-content: center; padding: 0 2px }
.lg-prev { border: 1.5px dashed #B45309; background: #FFF7E8 }
.chip-ai { background: var(--ai-wash); color: var(--ai) }
.chip-hard { background: #EEF1F5; color: #39475B }
.chip-soft { background: #F3EEFD; color: #6236C8 }
.mt { margin-top: 20px }
.crumb { display: block; font-size: 12px; color: var(--primary); margin-bottom: 4px }
.stepper .sdot { width: 20px; height: 20px; border-radius: 50%; background: var(--divider); color: var(--muted); display: grid; place-items: center; font-size: 11px }
.stepper li.on .sdot { background: var(--primary); color: #fff }
.stepper li.done .sdot { background: var(--good-bg); color: var(--good) }
.form { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)) }
.rules { display: flex; flex-direction: column; border: 1px solid var(--divider); border-radius: 4px; margin-top: 8px }
.rgroup { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 500; padding: 10px 12px 4px; background: var(--head) }
.rule { display: grid; grid-template-columns: minmax(0, 1fr) auto 130px; gap: 6px 12px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--divider) }
.rule.locked .rl { color: var(--muted) }
.rl { font-size: 13px; min-width: 0 }
.rnote { display: block; font-size: 11px; color: var(--warn) }
.rv { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: flex-end }
.rs { font-size: 11px; color: var(--muted); text-align: right }
.rule.tall { align-items: start }
.areas { max-width: 380px }
.area { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); background: var(--head); border-radius: 4px; padding: 2px 4px 2px 8px }
.numin { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted) }
.numin input { width: 54px; padding: 4px 6px; font-size: 13px; border: 1px solid #C4C4C4; border-radius: 4px; font-family: inherit }
.muted { color: var(--muted); font-weight: 400 }
.tot td { font-weight: 500; background: var(--head) }
.who { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.who li { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px }
.who .dot { margin-top: 5px }
.sq { width: 10px; height: 10px; border-radius: 2px; background: var(--primary-wash); border: 1px solid var(--primary); margin-top: 3px; flex: none }
.sq.kit { background: #FFF4D6; border-color: #D08A00 }
.warnt { color: var(--warn) }
.review { grid-template-columns: 320px minmax(0, 1fr) }
.dcard.isnew { border-color: #B45309; background: #FFFBF3 }
.dcard.locked { border-style: solid }
.dcard.blocked { border: 1px solid var(--bad); background: #FFF8F8 }

details summary { cursor: pointer; font-size: 12px; color: var(--primary) }

.fixes { border: 1px solid var(--ai); border-radius: 4px; padding: 10px 12px; background: #F7FAFF; display: flex; flex-direction: column; gap: 8px }

.fix { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; text-align: left; border: 1px solid var(--divider); background: var(--paper); border-radius: 4px; padding: 8px 10px; cursor: pointer }

.banner.preview { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: #FFF7E8; border: 1px solid #E8B36B; color: #5C3300; border-radius: 4px; padding: 10px 12px; margin-bottom: 12px }
.bact { display: flex; gap: 8px }
.notes { display: flex; flex-wrap: wrap; gap: 4px }
.small { font-size: 12px }
.gscroll { overflow-x: auto; border: 1px solid var(--divider); border-radius: 4px; margin-top: 8px }

@media (max-width: 700px) { .rule { grid-template-columns: minmax(0, 1fr) } .rv, .rs { justify-content: flex-start; text-align: left } }
.mini { font-size: 12.5px } .mini td, .mini th { padding: 5px 4px }

/* r3: calmer layout, one answer per step */
.narrow { max-width: 820px }
.result-wrap { margin: 4px 0 20px }
.result { font-size: 22px; line-height: 1.3; font-weight: 400; margin: 0; max-width: 46ch; text-wrap: balance }
.result.r-good { color: #0F5A27 }
.result.r-warn { color: #7A3604 }
.result-sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; max-width: 70ch }
.block { border-top: 1px solid var(--divider); padding: 18px 0 }
.sentence { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; font-size: 16px }
.sentence input[type=date] { font-family: inherit; font-size: 15px; border: 1px solid #C4C4C4; border-radius: 4px; padding: 6px 8px }
.sentence .numin input { width: 64px; font-size: 16px; padding: 6px 8px }
.fitline { margin: 12px 0 0; font-size: 13.5px; padding: 8px 12px; border-radius: 4px; max-width: 70ch }
.fitline.ok { background: var(--good-bg); color: #0F5A27 }
.fitline.short { background: var(--warn-bg); color: #7A3604 }
.rshead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px }
.rshead h2 { margin: 0 0 2px }
.quiet { color: var(--muted); font-size: 13px; margin: 0 }
.keyrules { margin: 12px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px }
.rulelist { margin-top: 14px; border: 1px solid var(--divider); border-radius: 6px }
.rrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--divider); font-size: 13.5px }
.rrow.wrap { flex-wrap: wrap }
.rrow .areas { display: flex; flex-wrap: wrap; gap: 6px; max-width: none }
.always { padding: 10px 14px }
.cta { padding-top: 8px }
.btn.big { padding: 11px 22px; font-size: 13px }
.blocker { border: 1px solid #E8B36B; background: #FFF9EF; border-radius: 6px; padding: 14px 16px; margin-bottom: 18px; display: grid; gap: 10px; max-width: 820px }
.blocker p { margin: 0; font-size: 14px }
.fixlist { display: grid; gap: 8px }
.fix { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; align-items: baseline; text-align: left; border: 1px solid var(--divider); background: var(--paper); border-radius: 6px; padding: 10px 14px; cursor: pointer; font-size: 14px }
.fix:hover, .fix:focus-visible { border-color: var(--primary) }
.ft { font-weight: 500 }
.fe { color: var(--good); font-size: 13px }
.previewbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; background: #FFF7E8; border: 1px solid #E8B36B; color: #5C3300; border-radius: 6px; padding: 10px 14px; margin-bottom: 18px }
.previewbar p { margin: 0 }
.viewbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px }
.viewbar h2 { margin: 0 }
.slist2, .pubrows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--divider) }
.srow, .pubrows li { border-bottom: 1px solid var(--divider) }
.sline, .pubrows li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 12px 4px }
.srow.isnew { background: #FFF9EF }
.srow.locked .slabel { background: var(--primary); color: #fff }
.slabel { display: inline-grid; place-items: center; min-width: 30px; height: 22px; border: 1.5px dashed var(--primary); border-radius: 4px; font-size: 11.5px; font-weight: 600; color: var(--primary) }
.swhen { font-size: 14px; min-width: 210px }
.swho { color: var(--muted); font-size: 13.5px; flex: 1; min-width: 200px }
.sseats { font-size: 13px; color: var(--muted) }
.sacts { display: flex; gap: 2px; margin-left: auto }
.btn-text.danger { color: var(--bad) }
.why { margin: 0 4px 12px 50px; background: var(--head); border-radius: 6px; padding: 10px 14px; font-size: 13px; max-width: 70ch }
.why p { margin: 0 0 6px }
.why ul { margin: 0; padding-left: 16px; display: grid; gap: 4px; color: var(--muted) }
.why li .num { color: var(--text); font-weight: 500 }
.gscroll .legend { padding: 8px 10px; margin: 0 }
.fill2 { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; align-items: start }
.sessions { display: grid; gap: 16px; min-width: 0 }
.sess2 { border: 1px solid var(--divider); border-radius: 6px }
.sess2 header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 14px; border-bottom: 1px solid var(--divider) }
.count { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--primary) }
.count.full { color: var(--good) }
.people { list-style: none; margin: 0; padding: 0 }
.people li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 14px; border-bottom: 1px solid #F0F0F0 }
.people li:last-child { border-bottom: 0 }
.people li.breaks { background: #FFF6F6 }
.pname { flex: 1; min-width: 160px; font-size: 13.5px }
.pflags { display: flex; flex-wrap: wrap; gap: 4px }
.people select, .waiting select { font-size: 12.5px; padding: 4px 6px; border: 1px solid #C4C4C4; border-radius: 4px; font-family: inherit; background: var(--paper) }
.openseat2 { color: var(--faint); font-style: italic; font-size: 13px }
.waiting h2 { margin-top: 0 }

.waiting li { display: grid; gap: 3px; border-left: 3px solid #E8B36B; padding-left: 10px }
.why2 { font-size: 12.5px; color: #7A3604 }
.effects { margin: 16px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--muted) }
@media (max-width: 860px) { .fill2 { grid-template-columns: minmax(0, 1fr) } .why { margin-left: 4px } .sacts { margin-left: 0 } }
.people select { border: 0; background: transparent; color: var(--primary); font-weight: 500; cursor: pointer }
.people select:hover, .people select:focus-visible { background: var(--primary-wash) }
.waiting { position: sticky; top: 16px }

/* r4: problem navigator, provenance, drag */
.pbar { position: sticky; top: 0; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; background: var(--paper); border: 1px solid var(--divider); border-radius: 6px; padding: 8px 12px; margin-bottom: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.06) }
.pbar.clear { color: var(--good); font-size: 13px; box-shadow: none }
.pcount { display: flex; gap: 12px; font-size: 13px; font-weight: 500 }
.pcount > span { display: inline-flex; align-items: center; gap: 6px }
.pdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: middle }
.pcount .pdot { margin-right: 0 }
.pdot.issue { background: var(--bad) }
.pdot.warning { background: #D08A00 }
.pdot.ok { background: var(--good) }
.pitem { flex: 1; min-width: 220px; text-align: left; border: 0; background: none; font-size: 13.5px; cursor: pointer; padding: 4px 6px; border-radius: 4px; border-left: 3px solid transparent }
.pitem.issue { border-left-color: var(--bad) }
.pitem.warning { border-left-color: #D08A00 }
.pitem:hover { background: var(--head) }
.pnav { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted) }
.focus { animation: focusflash 2.2s ease-out }
@keyframes focusflash { 0%, 40% { box-shadow: 0 0 0 3px var(--primary); background-color: var(--primary-wash) } 100% { box-shadow: 0 0 0 0 transparent } }
@media (prefers-reduced-motion: reduce) { .focus { animation: none; box-shadow: 0 0 0 3px var(--primary) } }
.prov { color: var(--muted); font-size: 12px; margin-left: 4px }
.prov::before { content: '('; } .prov::after { content: ')'; }
.srow.broken { background: #FFF6F6 }
.why.bad { background: #FFF0F0 }
.dragline { margin: 0 0 8px; font-size: 13px; color: var(--muted); min-height: 20px }
.dragline .ok { color: var(--good); font-weight: 500 }
.dragline .bad { color: var(--bad); font-weight: 500 }
.seg.sess.draft.grab { cursor: grab; touch-action: none }
.gscroll.dragging, .gscroll.dragging * { cursor: grabbing !important; user-select: none }
.seg.sess.draft.lifted { opacity: .35 }
.seg.sess.draft.broken { border-color: var(--bad); background: #FFF0F0 }
.seg.fitband { top: auto; bottom: 0; height: 5px; z-index: 0 }
.seg.fitband.ok { background: #46B868 }
.seg.fitband.bad { background: #F2B8BF }
.seg.ghost { top: 4px; bottom: 4px; border-radius: 3px; z-index: 4; display: flex; align-items: center; justify-content: center; pointer-events: none }
.seg.ghost.ok { background: rgba(23,162,65,.18); border: 2px solid var(--good) }
.seg.ghost.bad { background: rgba(176,0,32,.14); border: 2px solid var(--bad) }
.seg.ghost .sl { color: var(--text) }
.lg-fit { background: #46B868; height: 5px !important }

/* r4.1: warning and issue bar colours with icons */
button { color: inherit }
.pbar.has-warning { background: #FFE6C7; border: 1.5px solid #E8890C; color: #6B2F00 }
.pbar.has-issue { background: #FFF1F1; border-color: #E68A94; color: #7F0016 }
.pbar.clear { background: var(--good-bg); border-color: #9ED9AE; color: #0F5A27 }
.pc { display: inline-flex; align-items: center; gap: 6px; font-weight: 600 }
.pc.issue { color: #B00020 }
.pc.warning { color: #B45309 }
.pc.ok { color: #167F36 }
.picon { flex: none }
.pitem { display: inline-flex; align-items: flex-start; gap: 8px; color: inherit; border-left: 0; background: rgba(255,255,255,.7) }
.pitem .picon { margin-top: 1px }
.pitem.issue .picon { color: #B00020 }
.pitem.warning .picon { color: #B45309 }
.pitem:hover { background: #fff }
.pbar .iconbtn { color: inherit }
.pnav { color: inherit }

/* r5: resolve panel */
.pwrap { position: sticky; top: 0; z-index: 6; margin-bottom: 18px }
.pwrap .pbar { position: static; margin-bottom: 0 }
.pextra { display: inline-flex; gap: 2px; margin-left: 4px }
.pextra .btn-text { color: inherit; text-transform: none; font-size: 12.5px; text-decoration: underline; letter-spacing: 0 }
.pclear { flex: 1 }
.btn-fix { color: #fff; border: 0; padding: 6px 14px }
.btn-fix.warning { background: #B45309 }
.btn-fix.issue { background: #B00020 }
.ppanel { background: var(--paper); border: 1px solid var(--divider); border-top: 0; border-radius: 0 0 6px 6px; padding: 14px 16px; display: grid; gap: 12px; box-shadow: 0 6px 16px rgba(0,0,0,.08) }
.ppanel.warning { border-left: 4px solid #E8890C }
.ppanel.issue { border-left: 4px solid #B00020 }
.pwhy { margin: 0; font-size: 13.5px; color: var(--text) }
.pfixes { display: grid; gap: 8px }
.pdefer { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center }
.paccept { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; border-top: 1px solid var(--divider); padding-top: 12px }
.ptitle { width: 100%; font-size: 12.5px; font-weight: 500; color: var(--muted) }
.pf { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted) }
.pf.grow { flex: 1; min-width: 180px }
.pf select, .pf input { font-family: inherit; font-size: 13px; color: var(--text); border: 1px solid #C4C4C4; border-radius: 4px; padding: 6px 8px; background: var(--paper) }
.pdrawer { background: var(--paper); border: 1px solid var(--divider); border-top: 0; border-radius: 0 0 6px 6px; padding: 10px 14px }
.pdrawer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px }
.pdrawer li { display: flex; gap: 8px; align-items: flex-start }
.pdrawer li > span:nth-child(2) { flex: 1 }
.nicon { color: #5F6672 } .aicon { color: #167F36 }
.deferred { margin-top: 16px; border-top: 1px solid var(--divider); padding-top: 12px }
.deferred h3 { margin: 0 0 8px; font-size: 13px }
.deferred ul { list-style: none; margin: 0 0 8px; padding: 0; display: grid; gap: 6px }
.deferred li { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted) }
.accl { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px }

/* r6: several courses in one run */
.cdot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; vertical-align: middle }
.ctag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .02em; color: var(--cc); border: 1.5px solid var(--cc); border-radius: 3px; padding: 0 4px; line-height: 15px; background: var(--paper); vertical-align: 1px }
.block h2 { margin: 0 0 10px }

.badt { color: var(--bad); font-weight: 600 }
.okt { color: var(--good); font-weight: 600 }
.warnt { color: var(--warn); font-weight: 600 }
.adders { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin-top: 12px }
.adders .or { color: var(--muted); padding-bottom: 8px }
.adders .inl { display: flex; gap: 8px; align-items: center }
.adders input[type=date] { font-family: inherit; font-size: 13px; border: 1px solid #C4C4C4; border-radius: 4px; padding: 6px 8px }
.rulegroups { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; margin-top: 14px }
.rulegroups .rulelist { margin-top: 0 }
